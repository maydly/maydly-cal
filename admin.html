      else if (g.status === 'closed') acts = btn('approved', '승인', 'ok', k) + btn('black', '블랙', 'bk', k) + btn('none', '닫기 풀기', '', k);
      else acts = btn('approved', '승인', 'ok', k) + btn('closed', '닫기', '', k) + btn('black', '블랙', 'bk', k);
      var tail = g.n > 0 ? '<button type="button" class="sp-del" data-del="' + k + '">지우기</button>'
        : (!g.status ? '<button type="button" class="sp-del" data-drop="' + k + '">목록에서 빼기</button>' : '');
      var when = g.n > 0 ? '최근 요청 ' + md(g.last) + (g.n > 1 ? ' (' + g.n + '번)' : '') : '정한 날 ' + md(g.at);
      return '<div class="sp-card" data-key="' + k + '"><div class="sp-top"><div class="sp-who">' + E(g.name || '(이름 없음)')
        + (g.insta ? ' <small>@' + E(g.insta) + '</small>' : '') + '</div>' + stTag(g) + '</div>'
        + '<div class="sp-meta">' + (g.firstS && g.firstC ? '처음 연 날 시안 ' + md(g.firstS) + ' · 캘린더 ' + md(g.firstC) : '처음 연 날 ' + md(g.first) + (g.firstC && !g.firstS ? '(캘린더)' : '')) + ' · ' + when + (kinds ? '<br>' + kinds : '') + '</div>'
        + (g.blackMatch ? '<div class="sp-warn">블랙인 분과 같은 인스타예요</div>' : '')
        + '<div class="sp-acts">' + acts + tail + '</div></div>';
    }).join('');
    var own = G.owners, mk = myKey();
    var foot = own.length ? '<div class="sp-foot"><button type="button" class="sp-ownt" data-own>항상 보는 기기 ' + own.length + '대(명진님·수빈) · ' + (SP.showOwners ? '접기' : '보기') + '</button>'
      + (SP.showOwners ? '<div class="sp-owns">' + own.map(function (o) {
        return '<div class="sp-own"><span>' + (o.who === 's' ? '수빈 · ' : '명진님 · ') + E(o.dev || '기기') + ' · ' + md(o.at) + ' 등록</span>' + (o.key === mk ? '<b>이 기기</b>' : '<button type="button" class="sp-del" data-odrop="' + E(o.key) + '">빼기</button>') + '</div>';
      }).join('') + '</div>' : '') + '</div>' : '';
    box.innerHTML = '<div class="sianp">' + errBox
      + '<p class="sp-note">처음 연 날부터 1개월이 지난 기기는 여기서 «승인»한 분만 봐요. «닫기»·«블랙»은 누르는 즉시 닫혀요(1개월 안이라도). «풀기»는 처음 상태로 돌려요.</p>'
      + '<div class="sp-chips">' + chips + '</div><div class="sp-list">'
      + (rows || '<div class="sp-empty">' + (L.length ? '해당하는 분이 없어요.' : '아직 요청이 없어요.<br>문의 양식을 보내거나 닫힌 화면에서 «다시 보기 요청»을 누르면 여기에 올라와요.') + '</div>')
      + '</div>' + foot + '</div>';
  }
  function badge() {
    var n = SP.data ? group(SP.data).list.filter(isReq).length : 0;
    SP.pending = n;
    var b = document.getElementById('tnSianN');
    if (b) { b.textContent = n > 99 ? '99+' : String(n); b.classList.toggle('on', n > 0); }
    var t = document.getElementById('tnSian'); if (t) t.classList.toggle('has-req', n > 0);
    document.documentElement.classList.toggle('sian-req', SP.me && n > 0);
    entryRow();
  }
  /* «예약 현황» 화면 위쪽 «시안 열람» 줄 — 명진 로그인일 때만, 화면을 다시 그려도 다시 붙인다 */
  function entryRow() {
    var pg = document.getElementById('pg-req'); if (!pg) return;
    var row = pg.querySelector('.sian-entry');
    if (!SP.me) { if (row) row.parentNode.removeChild(row); return; }
    if (!row) {
      var host = pg.querySelector('.rq-wrap'); if (!host) return;
      row = document.createElement('div'); row.className = 'sian-entry';
      row.innerHTML = '<div class="se-t"><b>시안 열람</b><span>다시 보기 요청 <em class="se-n">0</em>건 · 승인·닫기·블랙</span></div><button type="button" class="se-b">열기</button>';
      row.querySelector('.se-b').addEventListener('click', function () { window.sianOpen(); });
      var stats = host.querySelector('.stats');
      if (stats && stats.parentNode === host) host.insertBefore(row, stats.nextSibling); else host.insertBefore(row, host.firstChild);
    }
    var e = row.querySelector('.se-n'); if (e) e.textContent = String(SP.pending);
    row.classList.toggle('has-req', SP.pending > 0);
  }
  var obs = null;
  function watchReqPage() {
    if (obs || !window.MutationObserver) return;
    var pg = document.getElementById('pg-req'); if (!pg) return;
    obs = new MutationObserver(function () { entryRow(); });
    obs.observe(pg, { childList: true });
  }
  /* 예전 판(이름 없이 저장)에서 정한 결정에 이름·인스타 채워 두기 — 한 번 불러올 때 10개까지 */
  function heal() {
    if (!window.MJCAL || !window.MJCAL.sianSetInfo || !SP.data) return;
    var acc = SP.data.access || {}, n = 0;
    group(SP.data).list.forEach(function (g) {
      var a = acc[g.key];
      if (n >= 10 || !a || !(a.status === 'approved' || a.status === 'closed' || a.status === 'black')) return;
      if ((a.name || !g.name) && (a.insta || !g.insta)) return;
      n++;
      var info = { name: a.name || g.name || '', insta: a.insta || g.insta || '' };
      window.MJCAL.sianSetInfo(g.key, info).then(function () { a.name = info.name; a.insta = info.insta; }).catch(function () {});
    });
  }
  function errMsg(e, kind) {
    var c = String((e && (e.code || e.message)) || '');
    if (/permission|insufficient|unauthenticated/i.test(c)) return '권한이 없어서 ' + (kind === 'save' ? '저장이' : '불러오기가') + ' 안 돼요. 명진님 계정으로 로그인했는지 확인해 주세요.';
    if (/unavailable|timeout|offline|network|failed-precondition|deadline/i.test(c)) return kind === 'save' ? '연결이 안 돼서 저장을 못 했어요. 다시 눌러 주세요.' : '연결이 안 돼서 최신 목록을 못 불러왔어요.';
    return kind === 'save' ? '저장하지 못했어요. 다시 눌러 주세요.' : '목록을 불러오지 못했어요.';
  }
  function load() {
    if (!window.MJCAL || !window.MJCAL.sianList) { SP.err = '준비 중이에요. 잠시 뒤 다시 열어 주세요.'; render(); return Promise.resolve(); }
    SP.loading = true;
    return window.MJCAL.sianList().then(function (d) {
      SP.loading = false; SP.err = ''; SP.data = d || { requests: [], access: {} }; SP.lastLoad = Date.now(); render(); badge(); heal();
    }).catch(function (e) { SP.loading = false; SP.lastLoad = Date.now() - EVERY + 60000; SP.err = errMsg(e, 'load'); render(); });
  }
  function find(key) { return SP.data ? group(SP.data).list.filter(function (g) { return g.key === key; })[0] : null; }
  /* 저장 — 성공 응답을 받은 뒤에만 화면을 바꾼다. 10초가 넘으면 안내만 하고, 늦게라도 성공하면 그때 반영. */
  function save(card, run, after) {
    if (card) card.classList.add('busy');
    var done = false;
    var t = setTimeout(function () { if (done) return; if (card) card.classList.remove('busy'); SP.err = '아직 저장 안 됐어요. 연결을 확인하고 다시 눌러 주세요.'; render(); }, SAVE_MS);
    run().then(function (r) { done = true; clearTimeout(t); SP.err = ''; after(r); render(); badge(); })
      .catch(function (e) { done = true; clearTimeout(t); if (card) card.classList.remove('busy'); SP.err = errMsg(e, 'save'); render(); });
  }
  function ensureData() { SP.data = SP.data || { requests: [], access: {} }; SP.data.access = SP.data.access || {}; SP.data.requests = SP.data.requests || []; }
  function act(key, status, card) {
    if (!window.MJCAL || !window.MJCAL.sianSet) return;
    if (status === 'black' && !confirm('이분을 블랙으로 둘까요? 1개월 안이라도 시안·캘린더를 못 보게 돼요.')) return;
    var g = find(key) || {};
    save(card, function () { return window.MJCAL.sianSet(key, status, { name: g.name || '', insta: g.insta || '' }); }, function () {
      ensureData(); var prev = SP.data.access[key] || {};
      SP.data.access[key] = { status: status, at: Date.now(), name: g.name || prev.name || '', insta: g.insta || prev.insta || '', dev: prev.dev || '' };
    });
  }
  function del(key, card) {
    if (!window.MJCAL || !window.MJCAL.sianDeleteRequests) return;
    var g = find(key) || {};
    if (!confirm('이 줄의 요청 기록을 지울까요? ' + (g.status ? '(승인·닫기·블랙과 이름은 그대로 남아요)' : '(목록에서 사라져요)'))) return;
    var a = (SP.data && SP.data.access && SP.data.access[key]) || null;
    var need = !!(a && g.status && window.MJCAL.sianSetInfo && ((!a.name && g.name) || (!a.insta && g.insta)));
    var info = need ? { name: a.name || g.name || '', insta: a.insta || g.insta || '' } : null;
    save(card, function () {
      return (need ? window.MJCAL.sianSetInfo(key, info) : Promise.resolve()).then(function () { return window.MJCAL.sianDeleteRequests(key); });
    }, function () {
      ensureData(); if (need) { a.name = info.name; a.insta = info.insta; }
      SP.data.requests = SP.data.requests.filter(function (r) { return r.key !== key; });
    });
  }
  function drop(key, card, owner) {
    if (!window.MJCAL || !window.MJCAL.sianDeleteAccess) return;
    if (!confirm(owner ? '이 기기를 «항상 보기»에서 뺄까요? 그 기기는 처음 연 날 기준으로 돌아가요.' : '목록에서 뺄까요?')) return;
    save(card, function () { return window.MJCAL.sianDeleteAccess(key); }, function () { ensureData(); delete SP.data.access[key]; });
  }
  function onClick(ev) {
    var t = ev.target; if (!t || !t.closest) return;
    var chip = t.closest('.sp-chip'); if (chip) { SP.filter = chip.getAttribute('data-f'); render(); return; }
    if (t.closest('[data-reload]')) { SP.err = ''; render(); load(); return; }
    if (t.closest('[data-own]')) { SP.showOwners = !SP.showOwners; render(); return; }
    var b = t.closest('[data-a]'); if (b) { act(b.getAttribute('data-k'), b.getAttribute('data-a'), b.closest('.sp-card')); return; }
    var d = t.closest('[data-del]'); if (d) { del(d.getAttribute('data-del'), d.closest('.sp-card')); return; }
    var x = t.closest('[data-drop]'); if (x) { drop(x.getAttribute('data-drop'), x.closest('.sp-card'), false); return; }
    var o = t.closest('[data-odrop]'); if (o) { drop(o.getAttribute('data-odrop'), o.closest('.sp-own'), true); }
  }
  /* 칸 하나에 그리기(관리자 창 · 시험판 공용) */
  window.sianPanelMount = function (box) {
    if (SP.box && SP.box !== box) SP.box.removeEventListener('click', onClick);
    SP.box = box; box.removeEventListener('click', onClick); box.addEventListener('click', onClick);
    SP.data = null; SP.err = ''; render(); return load();
  };
  window.sianPanelReload = load;
  /* 관리자 머리줄 단추 → 공용 창(ov · pn) 안에 칸 전용 상자를 만들어 연다 */
  window.sianOpen = function () {
    var h = document.getElementById('pnh'), pb = document.getElementById('pb'), ov = document.getElementById('ov');
    if (!h || !pb || !ov) return;
    h.innerHTML = '시안 열람<button class="px" onclick="closeP()">×</button>';
    pb.innerHTML = '';
    var host = document.createElement('div'); host.className = 'sianp-host'; pb.appendChild(host);
    window.sianPanelMount(host);
    ov.style.display = 'flex';
  };
  /* 배지만 다시 세기(칸이 열려 있으면 칸을 다시 불러옴) */
  function refresh() {
    if (attached(SP.box)) return load();
    if (!window.MJCAL || !window.MJCAL.sianList || SP.loading) return;
    SP.loading = true;
    window.MJCAL.sianList().then(function (d) { SP.loading = false; SP.data = d; SP.lastLoad = Date.now(); badge(); heal(); })
      .catch(function () { SP.loading = false; SP.lastLoad = Date.now() - EVERY + 60000; });
  }
  /* 명진 로그인 살피기 — 기존 로그인 처리는 건드리지 않고 읽기만 */
  function watch() {
    var u = window.MJCAL && window.MJCAL.user, email = (u && u.email) || '', me = email === ME, sub = email === SUBIN;
    SP.me = me;
    var b = document.getElementById('tnSian'); if (b) b.style.display = me ? '' : 'none';
    document.documentElement.classList.toggle('sian-on', me);
    if (!me && !sub) { SP.owned = false; document.documentElement.classList.remove('sian-req'); entryRow(); return; }
    if (!SP.owned && Date.now() >= SP.ownRetry && window.MJCAL.sianEnsureOwner) {
      SP.owned = true;
      window.MJCAL.sianEnsureOwner(me ? 'm' : 's').catch(function (e) {
        var c = String((e && (e.code || e.message)) || ''); SP.owned = false;
        SP.ownRetry = /permission|insufficient/i.test(c) ? Infinity : Date.now() + 60000;   /* 권한 문제면 다시 안 함 */
        console.warn('시안 열람: 이 기기 «항상 보기» 등록 못 함', c);
      });
    }
    if (!me) { document.documentElement.classList.remove('sian-req'); entryRow(); return; }
    watchReqPage(); entryRow();
    if (!document.hidden && !SP.loading && (!SP.lastLoad || (!EMBED && Date.now() - SP.lastLoad > EVERY))) refresh();
  }
  var hiddenAt = 0;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    var away = hiddenAt ? Date.now() - hiddenAt : 0; hiddenAt = 0;
    if (SP.me && !SP.loading && away >= AWAY && Date.now() - SP.lastLoad >= AWAY) refresh();
  });
  if (!window.__SIAN_DEMO__) { setInterval(watch, 2000); setTimeout(watch, 300); }
})();
</script>

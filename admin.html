<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" sizes="32x32" href="icon-cal-32.png?v=261105g">

(function(){try{var d=document.documentElement,em=new URLSearchParams(location.search).get('embed')==='1',fr=window.top!==window.self;if(fr)d.classList.add('mc-frame');if(!em&&!fr)d.classList.add('mc-hubbtn');}catch(e){}})();</script>
<title>maydly — 명진 캘린더 v3.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#fefefe;--bg2:#f7f9f7;--sf:#fff;--sf2:#f5f8f5;--sf3:#eef3ee;
  --bd:#e2ebe2;--bd2:#cddccd;
  --tx:#2a3a2a;--mu:#7a9a7a;--mu2:#5a7a5a;
  --R:#7ab87a;--Rl:rgba(122,184,122,.1);--Rd:#5a9a5a;
  --ok:#6ab87a;--wait:#c8a456;--ng:#c86060;
  --r:8px;
}
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400&display=swap');
body{font-family:-apple-system,'Pretendard','Apple SD Gothic Neo',sans-serif;height:100vh;overflow:hidden;background:var(--bg);color:var(--tx)}

/* ── LANDING ── */
#landing{
  height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;background:var(--bg);position:relative;overflow:hidden;
}
.land-clover-wrap{position:absolute;inset:0;pointer-events:none;overflow:hidden}

/* ── APP ── */
#app{height:100vh;width:100vw;max-width:100vw;overflow-x:hidden;display:none;flex-direction:column;background:var(--bg)}
.topnav{overflow-x:auto;scrollbar-width:none}
.topnav::-webkit-scrollbar{display:none}
.topnav{
  display:flex;align-items:center;padding:0 20px;
  border-bottom:1px solid var(--bd);background:var(--sf);
  flex-shrink:0;height:50px;gap:0;
}
.tn-logo{
  font-family:'Noto Serif KR',Georgia,serif;font-weight:300;font-style:italic;
  font-size:18px;color:var(--mu2);margin-right:20px;letter-spacing:1px;flex-shrink:0;
}
.tn-tabs{display:flex;flex:1;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tn-tabs::-webkit-scrollbar{display:none}
.tn-tab{
  padding:0 14px;height:50px;line-height:50px;font-size:11px;font-weight:600;
  color:var(--mu);cursor:pointer;border-bottom:2px solid transparent;
  transition:all .15s;white-space:nowrap;letter-spacing:.3px;flex-shrink:0;
}
/* 폰 — 탭이 4개로 늘어 자리가 빠듯하므로, 상단 우측 표시를 줄여 탭 자리를 확보한다 */
@media(max-width:560px){
  .tn-tab{padding:0 9px;letter-spacing:0}
  .tn-mode{display:none!important}
  .autosave-ind{font-size:10px!important;padding:3px 7px!important}
  .tn-logo{display:none}
}
.tn-tab:hover{color:var(--tx)}
.tn-tab.on{color:var(--Rd);border-bottom-color:var(--R)}
.tn-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tn-back{
  background:none;border:1px solid var(--bd);color:var(--mu);
  padding:5px 12px;border-radius:20px;cursor:pointer;font-size:11px;
  transition:all .2s;
}
.tn-back:hover{border-color:var(--R);color:var(--Rd)}
.tn-mode{font-size:10px;color:var(--mu);opacity:.7}

.page{flex:1;overflow:hidden;display:none}
.page.on{display:flex;flex-direction:column}

/* ── CAL LAYOUT ── */
.cal-layout{display:flex;flex:1;overflow:hidden;position:relative}
.cal-sb{
  width:190px;flex-shrink:0;background:var(--sf);
  border-right:1px solid var(--bd);overflow-y:auto;padding:14px 0;
  transition:width .25s,opacity .25s;
}
.cal-sb.collapsed{width:0;overflow:hidden;padding:0;opacity:0}
.sb-toggle{
  position:absolute;left:0;top:50%;transform:translateY(-50%);
  z-index:10;width:18px;height:44px;
  background:var(--sf);border:1px solid var(--bd);border-left:none;
  border-radius:0 6px 6px 0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--mu);font-size:10px;transition:left .25s,background .15s;
}
.sb-toggle:hover{background:var(--sf2);color:var(--Rd)}
.cal-body{flex:1;display:flex;flex-direction:column;overflow:hidden}
.cal-top{
  padding:10px 16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  border-bottom:1px solid var(--bd);background:var(--sf);flex-shrink:0;
}
/* 상단 라벨 필터바 (사이드바 대체, 웹·폰 공통) */
.cal-filterbar{display:flex;align-items:center;gap:6px;padding:7px 12px;border-bottom:1px solid var(--bd);background:var(--sf);flex-shrink:0}
.flt-chips{display:flex;gap:6px;flex:1;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:1px}
.flt-chip{display:flex;align-items:center;gap:5px;white-space:nowrap;border:1px solid var(--bd);background:var(--sf2);color:var(--mu);padding:4px 11px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;flex-shrink:0;transition:all .15s}
.flt-chip.on{background:#fff;color:var(--tx)}
.flt-chip:not(.on){opacity:.45}
.flt-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.flt-sync{flex-shrink:0;border:1px solid var(--bd);background:var(--sf2);color:var(--mu2);height:28px;padding:0 11px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:600;line-height:1;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.flt-sync:hover{border-color:var(--R);color:var(--Rd)}
.nb{
  background:var(--sf2);border:1px solid var(--bd);color:var(--tx);
  padding:4px 9px;border-radius:20px;cursor:pointer;font-size:11px;transition:border-color .15s;
}
.nb:hover{border-color:var(--R)}
.nb.ar{padding:4px 6px;font-size:12px;line-height:1}   /* 화살표 전용 — 연·월 이동 5개가 폰 한 줄에 들어가게 */
/* 좁은 폰(390px 등): 연 이동 버튼 2개가 늘어도 상단 줄이 한 줄로 유지되도록 여백만 줄인다 */
@media(max-width:440px){
  .cal-top{gap:5px;padding:10px 12px}
  .nb{padding:4px 7px}
  .nb.ar{padding:4px 5px}
  .vb{padding:4px 8px}
  .add-b{padding:6px 11px;margin-left:2px}
}
.ml{font-size:13px;font-weight:600;min-width:auto;color:var(--tx)}
.vt{display:flex;gap:2px;background:var(--sf2);border-radius:20px;padding:2px;margin-left:auto}
.vb{
  padding:4px 10px;border-radius:18px;border:none;background:none;
  color:var(--mu);cursor:pointer;font-size:11px;font-weight:600;transition:all .15s;
}
.vb.on{background:var(--R);color:#fff}
.add-b{
  border:none;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:600;
  cursor:pointer;background:var(--R);color:#fff;margin-left:4px;transition:background .15s;
}
.add-b:hover{background:var(--Rd)}

/* sidebar */
.mini-wrap{padding:12px}
.mini-hd{font-size:10px;color:var(--mu);font-weight:600;margin-bottom:7px;letter-spacing:.3px}
.mini-g{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.md{text-align:center;font-size:9px;padding:3px 1px;color:var(--mu);cursor:pointer;border-radius:2px}
.md.hd{font-weight:700;cursor:default}
.md.td{background:var(--R);color:#fff;border-radius:50%;font-weight:800}
.md.he{color:var(--tx);font-weight:600}
.sb-sect{font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:var(--mu);padding:10px 12px 5px;font-weight:700}
.sb-item{display:flex;align-items:center;gap:7px;padding:4px 12px;font-size:11px;cursor:pointer}
.sb-item input{width:12px;height:12px;cursor:pointer;accent-color:var(--R)}
.sb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sb-item span{color:var(--mu2);font-size:11px}
.legend{padding:10px 12px;border-top:1px solid var(--bd);margin-top:6px}
.leg-i{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--mu2);margin-bottom:5px}
.leg-d{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* MONTH */
.mg-wrap{padding:8px;display:flex;flex-direction:column;gap:4px;flex:1;overflow:hidden;min-height:0}
.mg-hdr.sticky-hdr{position:sticky;top:0;background:var(--bg);z-index:2;padding-top:2px}
.mg-hdr{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dl{text-align:center;font-size:12px;color:var(--mu);font-weight:700;padding:4px 0;letter-spacing:.5px}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:8px;overflow:hidden;flex:1;min-height:0}
.mc{background:var(--sf);padding:3px 2px;cursor:pointer;min-width:0;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:1px;scrollbar-width:none}
.mc::-webkit-scrollbar{width:0;display:none}
.m-bar>span{min-width:0}
.dn.sticky{position:sticky;top:-4px;background:var(--sf);z-index:1}
.mc:hover{background:var(--sf2)}
.mc.dim{opacity:.35;background:var(--bg2)}
.mc.tdc{background:var(--Rl)}
.dn{font-size:13px;color:var(--mu);font-weight:600;margin-bottom:2px;flex-shrink:0}
.tdc .dn{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:var(--R);color:#fff;font-size:8px;font-weight:800}
.m-bar{font-size:10.5px;padding:1px 4px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;margin-bottom:2px;cursor:pointer;flex-shrink:0;line-height:1.45}
/* 장기(다일) 일정 = 칸 여백 넘어 이어지는 연속 바 */
.m-span{margin-left:-3px;margin-right:-3px;border-radius:0;padding-left:6px}
.m-span.m-cont{padding-left:4px}
.m-bar-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.more-m{font-size:8px;color:var(--mu);padding:1px 4px}
.avail-slot{font-size:8px;padding:2px 5px;border-radius:10px;font-weight:600;margin-bottom:2px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}

/* TIME GRID */
.tg-wrap{flex:1;overflow:auto;padding:10px;position:relative}
.tg-inner{position:relative}
.tg-grid{display:grid;background:var(--bd);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.tg-corner{background:var(--sf2)}
.tg-dh{background:var(--sf2);padding:8px 5px;text-align:center}
.tg-dh .wd{font-size:9px;color:var(--mu);font-weight:700}
.tg-dh .wn{font-size:14px;font-weight:700}
.tg-dh.td .wn{background:var(--R);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;margin:0 auto}
.tg-tl{background:var(--sf);padding:3px 6px;font-size:9px;color:var(--mu);text-align:right;border-right:1px solid var(--bd);display:flex;align-items:flex-start;justify-content:flex-end;padding-top:4px}
.tg-cell{background:var(--sf);border-left:1px solid var(--bd);cursor:pointer}
.tg-cell:hover{background:var(--sf2)}
.t-block{position:absolute;border-radius:6px;padding:4px 7px;font-size:9px;font-weight:600;overflow:hidden;cursor:pointer;transition:filter .15s;z-index:1;color:#fff}
.t-block:hover{filter:brightness(.95)}
.tb-lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-time{font-size:8px;opacity:.8;margin-top:1px}

/* PANEL */
.ov{position:fixed;inset:0;background:rgba(30,40,30,.35);z-index:300;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.pn{background:var(--sf);border:1px solid var(--bd);border-radius:14px;width:min(440px,94vw);max-width:94vw;max-height:88vh;overflow-y:auto;overflow-x:hidden;padding:26px 18px;box-shadow:0 8px 40px rgba(0,0,0,.08)}
.pn .fg2>*,.pn .fg>div>input,.pn .fg>div>select{min-width:0}
.pn-h{font-size:14px;font-weight:600;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}
.px{background:none;border:none;color:var(--mu);font-size:20px;cursor:pointer;opacity:.6;transition:opacity .15s}
.px:hover{opacity:1}
.fg{margin-bottom:12px}
.fg label{font-size:9px;color:var(--mu);display:block;margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg select,.fg textarea{width:100%;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);padding:9px 11px;border-radius:var(--r);font-size:16px;outline:none;font-family:inherit}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--R);background:var(--sf)}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub-btn{width:100%;padding:11px;border:none;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;background:var(--R);color:#fff;margin-top:4px;transition:background .15s}
.sub-btn:hover{background:var(--Rd)}
.sub-btn:disabled{opacity:.5;cursor:not-allowed}
/* 일정 폼 저장 버튼 하단 고정 — 스크롤 없이 항상 보이게 */
.form-foot{position:sticky;bottom:-26px;z-index:5;background:var(--sf);margin:8px -18px -26px;padding:10px 18px 16px;box-shadow:0 -10px 14px -10px rgba(0,0,0,.12)}
.form-foot .sub-btn{margin-top:0}
@media(max-width:520px){.pn{max-height:92vh;padding:18px 14px}.fg{margin-bottom:9px}.form-foot{margin:8px -14px -18px;padding:10px 14px 14px;bottom:-18px}}
.label-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:4px}
.label-chip{border-radius:20px;padding:5px 6px;cursor:pointer;font-size:9px;font-weight:700;text-align:center;color:#fff;transition:opacity .15s;border:2px solid transparent;opacity:.6}
.label-chip:hover{opacity:.85}
.label-chip.sel{border-color:rgba(0,0,0,.25);opacity:1}
.badge{padding:2px 9px;border-radius:20px;font-size:9px;font-weight:700;display:inline-block}
.bOK{background:rgba(106,184,122,.15);color:var(--ok)}
.bWAIT{background:rgba(200,164,86,.15);color:var(--wait)}
.det-r{display:flex;gap:8px;font-size:12px;margin-bottom:9px;align-items:flex-start}
.det-l{color:var(--mu2);font-size:10px;min-width:60px;flex-shrink:0;margin-top:1px}
.act-row{display:flex;gap:8px;margin-top:14px}
.btn-ok{background:var(--ok);color:#fff;border:none;padding:8px 18px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer}
.btn-ng{background:transparent;color:var(--ng);border:1px solid var(--ng);padding:8px 18px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer}
.btn-del{width:100%;background:none;border:1px solid var(--bd);color:var(--ng);padding:7px;border-radius:20px;cursor:pointer;font-size:11px;margin-top:8px}
.client-view-box{margin-top:12px;padding:10px 12px;background:var(--sf2);border-radius:var(--r);border-left:2px solid var(--R)}
.cv-label{font-size:9px;color:var(--mu);font-weight:700;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.cv-val{font-size:11px;color:var(--Rd)}

/* REQ */
.rq-wrap{flex:1;overflow-y:auto;padding:18px}
.rcard{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:10px}
.rn{font-size:13px;font-weight:700}
.rm{font-size:10px;color:var(--mu2);margin-top:3px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:13px}
.sn{font-size:22px;font-weight:800;color:var(--R)}
.sl{font-size:10px;color:var(--mu2);margin-top:2px}
.sect-label{font-size:9px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}

/* IMPORT */
.import-wrap{flex:1;overflow-y:auto;padding:18px}
.import-box{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px}
.import-box h3{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--Rd)}
.import-box p{font-size:11px;color:var(--mu2);line-height:1.7;margin-bottom:12px}
.import-box textarea{width:100%;height:140px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);padding:10px;border-radius:var(--r);font-size:11px;font-family:monospace;outline:none;resize:vertical}
.import-box textarea:focus{border-color:var(--R)}
.import-result{margin-top:10px;font-size:11px;padding:8px 12px;border-radius:var(--r);display:none}
.import-result.ok{background:rgba(106,184,122,.12);color:var(--ok);display:block}
.import-result.err{background:rgba(200,96,96,.08);color:var(--ng);display:block}

/* STORAGE INFO */
.storage-bar{padding:10px 12px;border-top:1px solid var(--bd);margin-top:8px}
.storage-info{font-size:10px;color:var(--mu2);line-height:1.8}
.storage-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--R);margin-right:4px;vertical-align:middle}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--sf);border:1px solid var(--bd);color:var(--Rd);padding:10px 22px;border-radius:30px;font-size:11px;font-weight:700;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.toast.on{opacity:1}
option{background:#fff}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}

/* ADMIN LOGIN */
.login-wrap{display:flex;gap:8px;margin-bottom:12px}
.login-btn{flex:1;padding:11px;border:1px solid var(--bd);border-radius:var(--r);background:var(--sf2);cursor:pointer;font-size:11px;font-weight:600;color:var(--mu2);transition:all .2s;text-align:center}
.login-btn:hover,.login-btn.sel{border-color:var(--R);color:var(--Rd);background:var(--Rl)}

/* iCal fetch result */
#ical-fetch-result { margin-top:6px; font-size:12px; white-space:pre-wrap; }
/* ── 대시보드 (260912) ── */
#pg-dash{--dmint:#cfe9db;--dmint2:#a9dcc3;--dlime:#d8e85c;--dlime2:#eef3b8;--dgrn:#3f7a4a;
  --dredbg:#fdeceb;--dambbg:#fdf4e6;--dln:#eef2ed;overflow:auto;background:#f5f8f4}
.dwrap{display:grid;grid-template-columns:1fr 292px;gap:13px;padding:18px;max-width:1280px;margin:0 auto}
@media(max-width:900px){#pg-dash:not(.fit) .dwrap{grid-template-columns:1fr}}
.dmain{display:flex;flex-direction:column;gap:13px;min-width:0}
.drail{display:flex;flex-direction:column;gap:13px;min-width:0}
.dhd h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.ddate{font-size:12px;color:var(--mu);margin-top:2px}
.dcard{background:#fff;border-radius:18px;padding:15px 16px}
.dch{display:flex;align-items:center;margin-bottom:12px;gap:8px}
.dch h2{margin:0;font-size:14px;font-weight:800}

  --hz-ink:#1c2620;--hz-sub:#5d6b5f;--hz-mute:#687568;--hz-line:#e3e9e0;--hz-soft:#f7faf6;
  --hz-red:#c9372c;--hz-redbg:#fdeceb;--hz-amb:#b85c00;--hz-ambbg:#fdecd8;--hz-ylw:#735900;--hz-ylwbg:#fbf2c9;
  --hz-sh:0 1px 2px rgba(28,38,32,.035),0 10px 30px rgba(28,38,32,.055);
  --hz-shx:0 2px 6px rgba(28,38,32,.05),0 18px 46px rgba(28,38,32,.09);
  --hz-ease:cubic-bezier(.2,.75,.25,1);
  /* 기존 변수 «이름»은 그대로, «값»만 허브 톤으로 — 화면을 그리는 문자열 속 인라인 스타일 150여 곳이 함께 바뀐다 */
  --bg:#f0f6ef;--bg2:#f4f8f3;--sf:#fff;--sf2:#f7faf6;--sf3:#eef3ec;
  --bd:#e3e9e0;--bd2:#d4ddd1;
  --tx:#1c2620;--mu:#687568;--mu2:#5d6b5f;
  --R:#3d7a52;--Rl:rgba(79,154,106,.12);--Rd:#2f6e47;
  --ok:#3b8053;--wait:#9a6f12;--ng:#c9372c;
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  font-variant-numeric:tabular-nums;letter-spacing:-.2px;-webkit-font-smoothing:antialiased;word-break:keep-all;color:var(--hz-ink)}
*{-webkit-tap-highlight-color:transparent}
@supports(height:100dvh){ body,#landing,#app{height:100dvh} }
button,input,select,textarea{font-family:inherit}
a:focus-visible,button:focus-visible,[role="button"]:focus-visible,.tn-tab:focus-visible{outline:2px solid var(--hz-g);outline-offset:2px;border-radius:10px}
svg.mi{width:20px;height:20px;flex:0 0 auto;display:block;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* ── 상단 바 ── */
.topnav{height:60px;padding:0 16px 0 18px;gap:12px;background:rgba(250,253,249,.86);
  -webkit-backdrop-filter:saturate(1.5) blur(14px);backdrop-filter:saturate(1.5) blur(14px);border-bottom:1px solid var(--hz-line)}
.tn-logo{display:flex;align-items:center;gap:8px;margin-right:6px;font-family:inherit;font-style:normal;font-weight:700;font-size:19px;
  letter-spacing:-.7px;color:var(--hz-ink);line-height:1}
.tn-logo .d{color:var(--hz-g)}
.tn-logo .clvmark{width:25px;height:25px;color:var(--hz-g);flex:0 0 auto;transform-origin:50% 85%;animation:mcSway 7s ease-in-out infinite}
@keyframes mcSway{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
.tn-tabs{gap:4px;align-items:center;height:100%;padding:0 2px}
.tn-tab{display:flex;align-items:center;gap:7px;height:38px;line-height:1;padding:0 13px 0 10px;border-radius:12px;border-bottom:0;
  font-size:13px;font-weight:600;color:var(--hz-sub);letter-spacing:-.2px;position:relative;
  transition:background .14s,color .14s,box-shadow .18s,transform .1s}
.tn-tab .ti{display:flex;align-items:center;justify-content:center;color:var(--kc,#4f9a6a);transition:background .16s,transform .16s,box-shadow .18s}
.tn-tab .ti svg.mi{width:19px;height:19px}
.tn-tab:hover{background:rgba(255,255,255,.85);color:var(--hz-ink)}
.tn-tab:active{transform:scale(.97)}
.tn-tab.on{background:linear-gradient(135deg,var(--kt1),var(--kt2));color:var(--ki);font-weight:700;border-bottom-color:transparent;
  box-shadow:0 4px 12px -6px var(--k2),inset 0 0 0 1px rgba(255,255,255,.65)}
.tn-tab.on .ti{color:var(--ki)}
.tn-tab .tn-n{min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--hz-red);color:#fff;font-size:11.5px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;line-height:1}
.tn-tab .tn-n.soft{background:#e3ebdf;color:#46604a}
.tn-tab[data-k=dash]{--k1:#a8d3a0;--k2:#7fb877;--kc:#4f9a6a;--ki:#2b6a3c;--kt1:#e6f4e2;--kt2:#d2eacb}
.tn-tab[data-k=cal]{--k1:#efc2b3;--k2:#dfa28f;--kc:#cf7258;--ki:#95422c;--kt1:#fdeee8;--kt2:#f8dacf}
.tn-tab[data-k=alert]{--k1:#e3cf9d;--k2:#d0b97e;--kc:#b08c34;--ki:#6b510f;--kt1:#faf3df;--kt2:#f1e3bd}
.tn-tab[data-k=req]{--k1:#d3bfe0;--k2:#b79bd4;--kc:#9677c0;--ki:#5d3e86;--kt1:#f3ecf9;--kt2:#e5d8f2}
.tn-tab[data-k=import]{--k1:#a6c8e2;--k2:#80a9cf;--kc:#4f86ba;--ki:#245887;--kt1:#e8f1f9;--kt2:#d3e3f3}
.tn-right{gap:8px}
.tn-mode{font-size:12px;font-weight:600;color:var(--hz-mute);opacity:1;white-space:nowrap}
.tn-back{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--hz-line);background:#fff;color:var(--hz-sub);font-size:13px;font-weight:600;
  white-space:nowrap;transition:background .12s,border-color .12s,color .12s}
.tn-back:hover{background:#f5f8f4;border-color:#d4ddd1;color:var(--hz-ink)}
.tn-search{display:inline-flex;align-items:center;gap:8px;height:36px;min-width:210px;padding:0 8px 0 11px;border-radius:10px;border:1px solid var(--hz-line);
  background:#fff;color:#8a978a;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,box-shadow .18s,color .12s}
.tn-search svg.mi{width:17px;height:17px;color:var(--hz-g)}
.tn-search:hover{border-color:#cfdccb;color:var(--hz-sub);box-shadow:0 4px 14px -8px rgba(61,122,82,.35)}
.tn-search kbd{margin-left:auto;font:inherit;font-size:11px;font-weight:700;color:#8a978a;background:var(--hz-soft);border:1px solid var(--hz-line);border-radius:6px;padding:1px 6px;line-height:1.5}
.autosave-ind{border-radius:999px!important;font-size:12px!important;font-weight:700!important;padding:6px 11px!important;border-width:1px!important;letter-spacing:-.2px}
@media(max-width:1180px){ .tn-search{min-width:0} .tn-search .lbl{display:none} }
@media(max-width:900px){ .tn-mode{display:none} .tn-search kbd{display:none} }

/* ── 캘린더 도구줄 ── */
.cal-top{padding:14px 18px 10px;gap:8px;background:transparent;border-bottom:0}
.nb{height:36px;min-width:36px;padding:0 13px;border-radius:10px;border:1px solid var(--hz-line);background:#fff;color:var(--hz-sub);
  font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:4px;
  transition:background .12s,border-color .12s,color .12s,transform .1s}
.nb:hover{background:#f5f8f4;border-color:#d4ddd1;color:var(--hz-ink)}
.nb:active{transform:scale(.95)}
.nb.ar{padding:0;width:36px}
.nb svg.mi{width:17px;height:17px;stroke-width:2.1}
.ml{font-size:19px;font-weight:700;letter-spacing:-.6px;color:var(--hz-ink);margin:0 6px;white-space:nowrap}
.vt{background:#fff;border-radius:12px;padding:3px;box-shadow:var(--hz-sh),inset 0 0 0 1px rgba(227,233,224,.6);gap:2px}
.vb{height:30px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--hz-sub);transition:background .14s,color .14s,box-shadow .18s}
.vb:hover{color:var(--hz-ink)}
.vb.on{background:linear-gradient(135deg,#fdeee8,#f8dacf);color:#95422c;font-weight:700;box-shadow:0 4px 12px -6px #dfa28f,inset 0 0 0 1px rgba(255,255,255,.65)}
.add-b{height:38px;padding:0 16px 0 13px;border-radius:12px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,#3b8053,#2f6e47);box-shadow:0 6px 16px -7px rgba(61,122,82,.65);transition:transform .1s,box-shadow .18s,filter .12s}
.add-b:hover{background:linear-gradient(135deg,#3b8053,#2f6e47);filter:brightness(1.06)}
.add-b:active{transform:scale(.97)}
.add-b svg.mi{width:17px;height:17px;stroke-width:2.3}

/* ── 라벨 필터 ── */
.cal-filterbar{padding:0 18px 10px;gap:8px;background:transparent;border-bottom:0}
.flt-chips{gap:7px;padding:2px 2px 3px}
.flt-chip{height:32px;padding:0 13px 0 11px;gap:6px;border:0;border-radius:999px;background:#fff;color:var(--hz-ink);font-size:12.5px;font-weight:700;
  box-shadow:0 1px 2px rgba(28,38,32,.05),inset 0 0 0 1px var(--hz-line);transition:background .14s,color .14s,box-shadow .18s,opacity .14s,transform .1s}
.flt-chip:hover{box-shadow:0 4px 12px -8px rgba(28,38,32,.3),inset 0 0 0 1px #d4ddd1}
.flt-chip:active{transform:scale(.96)}
.flt-chip.on{background:#fff;color:var(--hz-ink)}
.flt-chip:not(.on){opacity:1;background:rgba(255,255,255,.45);color:#9aa69a;box-shadow:inset 0 0 0 1px rgba(212,221,209,.8)}
.flt-chip:not(.on) .flt-dot{background:transparent!important;box-shadow:inset 0 0 0 2px #c3cdc1}
.flt-dot{width:9px;height:9px;transition:background .14s,box-shadow .14s}
.flt-sync{height:32px;padding:0 12px 0 10px;border:0;border-radius:10px;background:#fff;color:var(--hz-pri);font-size:12.5px;font-weight:700;
  box-shadow:inset 0 0 0 1px var(--hz-line);transition:background .12s,box-shadow .18s,transform .1s}
.flt-sync:hover{background:#f3f8f1;box-shadow:inset 0 0 0 1px #cfdfca}
.flt-sync:active{transform:scale(.97)}
.flt-sync svg.mi{width:15px;height:15px;stroke-width:2.1}

/* ── 월 보기 ── */
.mg-wrap{padding:0 18px 14px;gap:6px}
.dl{font-size:12px;font-weight:700;color:var(--hz-mute);letter-spacing:0;padding:2px 0 3px}
.mg-hdr .dl:first-child{color:#c9372c}
.mg-hdr .dl:last-child{color:#3b6ea5}
.mg{gap:6px;padding:2px;background:transparent;border:0;border-radius:0}
.mc{background:#fff;border-radius:13px;padding:5px 5px 4px;gap:3px;
  box-shadow:0 1px 2px rgba(28,38,32,.04),inset 0 0 0 1px rgba(227,233,224,.75);
  transition:background .12s,box-shadow .18s}
.mc:hover{background:#fbfdfa;box-shadow:0 8px 18px -12px rgba(28,38,32,.28),inset 0 0 0 1px #d6e2d2}
.mc.dim{opacity:1;background:rgba(255,255,255,.42);box-shadow:inset 0 0 0 1px rgba(227,233,224,.5)}
.mc.dim>*{opacity:.42}
.mc.tdc{background:linear-gradient(165deg,#e6f3e2 0%,#fff 62%);box-shadow:0 8px 18px -12px rgba(61,122,82,.5),inset 0 0 0 1.5px #b6d8b1}
.mc>.dn{font-size:12.5px;font-weight:700;color:var(--hz-sub);margin:1px 0 2px 2px;line-height:22px;height:22px}
.dn.sticky{background:inherit;border-radius:8px}
.mg .mc:nth-child(7n+1) .dn{color:#c0392b}
.mg .mc:nth-child(7n) .dn{color:#3b6ea5}
.mc.tdc .dn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin:0 0 2px;border-radius:50%;
  background:linear-gradient(160deg,#3b8053,#2c6843);color:#fff!important;font-size:12px;font-weight:800;box-shadow:0 4px 10px -4px rgba(61,122,82,.65)}
.m-bar{font-size:11.5px;font-weight:600;padding:2px 6px;border-radius:7px;line-height:1.38;margin-bottom:0;
  transition:transform .1s,filter .12s,box-shadow .18s}
.m-bar:hover{filter:saturate(1.15) brightness(.98);box-shadow:0 3px 8px -5px rgba(28,38,32,.35)}
.m-bar:active{transform:scale(.97)}
.m-span{margin-left:-5px;margin-right:-5px;border-radius:0;padding-left:8px}
.m-span.m-cont{padding-left:6px}
@media(max-width:560px){
  .mg-wrap{padding:0 8px 8px;gap:4px}
  .mg{gap:3px;padding:1px}
  .mc{border-radius:9px;padding:3px 2px 2px;gap:2px}
  .mc>.dn{font-size:11.5px;margin:0 0 1px 2px;line-height:19px;height:19px}
  .mc.tdc .dn{width:20px;height:20px;font-size:11px}
  .m-bar{font-size:10.5px;padding:1px 3px;border-radius:5px;line-height:1.32}
  .m-span{margin-left:-2px;margin-right:-2px}
}
/* 검색으로 옮겨 왔을 때 칸 반짝임 */
.mc.mc-flash{animation:mcFlash 1.6s var(--hz-ease)}
@keyframes mcFlash{0%{box-shadow:0 0 0 0 rgba(79,154,106,.55),inset 0 0 0 2px #4f9a6a}35%{box-shadow:0 0 0 9px rgba(79,154,106,0),inset 0 0 0 2px #4f9a6a}100%{box-shadow:0 1px 2px rgba(28,38,32,.04),inset 0 0 0 1px rgba(227,233,224,.75)}}
.m-bar.mc-flash,.t-block.mc-flash{animation:mcChip 1.4s var(--hz-ease)}
@keyframes mcChip{0%,30%{box-shadow:0 0 0 3px #fff,0 0 0 5px #4f9a6a}100%{box-shadow:none}}

/* 달 넘김 — 넘긴 쪽으로 살짝 미끄러지며 */
#calBody.mc-slide-l .mg-wrap,#calBody.mc-slide-l .tg-wrap{animation:mcSlideL .26s var(--hz-ease)}
#calBody.mc-slide-r .mg-wrap,#calBody.mc-slide-r .tg-wrap{animation:mcSlideR .26s var(--hz-ease)}
@keyframes mcSlideL{from{opacity:.25;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes mcSlideR{from{opacity:.25;transform:translateX(-26px)}to{opacity:1;transform:none}}

/* ── 주·일 보기 ── */
.tg-wrap{padding:0 18px 14px}
.tg-grid{border:0;border-radius:16px;box-shadow:var(--hz-sh),inset 0 0 0 1px rgba(227,233,224,.8);gap:0;background:#edf2eb}
.tg-corner,.tg-dh{background:#fbfdfa}
.tg-dh{padding:9px 5px}
.tg-dh .wd{font-size:11.5px;font-weight:700;color:var(--hz-mute)}
.tg-dh .wn{font-size:15px;font-weight:700;color:var(--hz-ink);letter-spacing:-.4px}
.tg-dh.td .wn{background:linear-gradient(160deg,#3b8053,#2c6843);width:28px;height:28px;font-size:13px;box-shadow:0 4px 10px -4px rgba(61,122,82,.65)}
.tg-tl{font-size:11px;font-weight:600;color:#93a091;background:#fff;border-right:1px solid #eef2ec}
.tg-cell{background:#fff;border-left:0;border-top:1px solid #f1f5f0}
.tg-cell:hover{background:#f7fbf6}
.t-block{border-radius:9px;padding:4px 7px;font-size:11.5px;font-weight:700;transition:filter .12s,transform .1s,box-shadow .18s}
.t-block:hover{filter:saturate(1.15) brightness(.98);box-shadow:0 6px 14px -8px rgba(28,38,32,.4)}
.tb-time{font-size:10.5px;font-weight:600;opacity:.8}
@media(max-width:560px){ .tg-wrap{padding:0 8px 8px} .t-block{font-size:10.5px;padding:3px 5px} }

/* ── 창(패널) — 밝은 서리 막 + 둥근 카드, 폰은 아래에서 올라오는 시트 ── */
.ov{background:rgba(240,246,239,.62);-webkit-backdrop-filter:saturate(1.2) blur(6px);backdrop-filter:saturate(1.2) blur(6px);padding:20px;animation:mcFade .16s ease-out}
@keyframes mcFade{from{opacity:0}to{opacity:1}}
.pn{border:0;border-radius:24px;padding:24px 22px 26px;width:min(460px,94vw);
  box-shadow:0 4px 12px rgba(28,38,32,.08),0 24px 60px rgba(28,38,32,.16);animation:mcPop .26s var(--hz-ease)}
@keyframes mcPop{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.pn-h{font-size:17px;font-weight:700;letter-spacing:-.4px;margin-bottom:16px;color:var(--hz-ink);gap:10px;line-height:1.35}
.px{width:36px;height:36px;flex:0 0 auto;border-radius:12px;background:var(--hz-soft);color:var(--hz-sub);font-size:22px;line-height:1;opacity:1;
  display:inline-flex;align-items:center;justify-content:center;transition:background .12s,color .12s,transform .1s}
.px:hover{background:#eef3ec;color:var(--hz-ink)}
.px:active{transform:scale(.92)}
.form-foot{margin:10px -22px -26px;padding:12px 22px 18px;bottom:-26px;box-shadow:0 -12px 18px -14px rgba(28,38,32,.22)}
@media(max-width:560px){
  .ov{align-items:flex-end;padding:0}
  .pn{width:100%;max-width:100%;max-height:min(92vh,calc(100% - 12px));border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));
    animation:mcSheet .3s var(--hz-ease)}
  .pn::before{content:'';display:block;width:38px;height:5px;border-radius:3px;background:#dfe6dc;margin:0 auto 12px}
  .form-foot{margin:10px -16px calc(-18px - env(safe-area-inset-bottom,0px));padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));
    bottom:calc(-18px - env(safe-area-inset-bottom,0px))}
}
@keyframes mcSheet{from{opacity:.4;transform:translateY(46px)}to{opacity:1;transform:none}}

/* ── 입력 ── */
.fg{margin-bottom:14px}
.fg label{font-size:12px;font-weight:700;color:var(--hz-sub);text-transform:none;letter-spacing:-.1px;margin-bottom:6px}
.fg input,.fg select,.fg textarea{background:#fff;border:1px solid var(--hz-line);border-radius:12px;padding:10px 13px;min-height:44px;font-weight:600;
  transition:border-color .12s,box-shadow .12s}
.fg textarea{min-height:84px;font-weight:500;line-height:1.55}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--hz-g);box-shadow:0 0 0 4px rgba(79,154,106,.14);background:#fff}
.sub-btn{min-height:46px;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:700;
  background:linear-gradient(135deg,#3b8053,#2f6e47);box-shadow:0 6px 16px -7px rgba(61,122,82,.65);transition:transform .1s,box-shadow .18s,filter .12s}
.sub-btn:hover{background:linear-gradient(135deg,#3b8053,#2f6e47);filter:brightness(1.06)}
.sub-btn:active{transform:scale(.985)}
.label-grid{gap:7px}
.label-chip{min-height:36px;display:flex;align-items:center;justify-content:center;padding:6px 6px;border-radius:12px;font-size:12px;font-weight:700;
  opacity:.5;border:2px solid transparent;transition:opacity .14s,transform .1s,box-shadow .18s}
.label-chip:hover{opacity:.82}
.label-chip:active{transform:scale(.96)}
.label-chip.sel{opacity:1;border-color:transparent!important;box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(28,38,32,.55),0 6px 14px -8px rgba(28,38,32,.45)}
.login-btn{min-height:46px;border-radius:12px;font-size:13px;font-weight:700;background:#fff}
.login-btn:hover,.login-btn.sel{background:var(--hz-gl);border-color:#bcd8c2;color:#2d6a3e}

/* ── 상세 ── */
.badge{font-size:12px;padding:3px 10px;border-radius:999px;font-weight:700}
.bOK{background:#e2f1de;color:#2f6b45}
.bWAIT{background:#faf3df;color:#6b510f}
.det-r{font-size:14px;gap:12px;margin-bottom:0;padding:10px 0;border-top:1px solid #f1f5f0;align-items:baseline;line-height:1.5;overflow-wrap:anywhere}
.det-l{font-size:12px;font-weight:700;color:var(--hz-mute);min-width:78px;margin-top:0;white-space:nowrap}
.client-view-box{margin-top:14px;padding:12px 14px;border-radius:14px;border-left:0;background:linear-gradient(160deg,#eef6eb,#f8fbf6);box-shadow:inset 0 0 0 1px #dcebd7}
.cv-label{font-size:11.5px;font-weight:700;color:var(--hz-mute);text-transform:none;letter-spacing:0;margin-bottom:3px}
.cv-val{font-size:13px;color:var(--hz-pri);font-weight:700}
.act-row{gap:8px;margin-top:14px;flex-wrap:wrap}
.btn-ok{min-height:40px;padding:9px 18px;border-radius:12px;font-size:13px;background:linear-gradient(135deg,#3b8053,#2f6e47);box-shadow:0 6px 14px -8px rgba(61,122,82,.6);
  transition:transform .1s,filter .12s}
.btn-ok:hover{filter:brightness(1.06)} .btn-ok:active{transform:scale(.97)}
.btn-ng{min-height:40px;padding:9px 16px;border-radius:12px;font-size:13px;background:#fff;border:1px solid #f0c9c3;color:var(--hz-red);transition:background .12s,transform .1s}
.btn-ng:hover{background:#fff6f5} .btn-ng:active{transform:scale(.97)}
.btn-del{min-height:42px;border-radius:12px;font-size:13px;font-weight:600;border:1px solid #f0d6d2;color:var(--hz-red);background:#fff;margin-top:10px;transition:background .12s}
.btn-del:hover{background:#fff6f5}

/* ── 알림 · 예약 현황 · 가져오기 ── */

#pg-dash{background:transparent}
.dwrap{gap:14px;padding:20px clamp(14px,2.4vw,28px) 28px}

.c-two{--k1:#a6c8e2;--k2:#80a9cf}.c-rev{--k1:#ecd0a8;--k2:#d4a36e}.c-m3{--k1:#a8d3a0;--k2:#7fb877}.c-nsw{--k1:#efc2b3;--k2:#dfa28f}
.c-todo{--k1:#e3cf9d;--k2:#d0b97e}.c-free{--k1:#a8d3a0;--k2:#7fb877}.c-noshlist{--k1:#d3bfe0;--k2:#b79bd4}

.kpi.hl{background:linear-gradient(160deg,var(--tint) 0%,#fff 72%)}
.kpi.clickable{transition:transform .1s,box-shadow .18s,background .1s}
@media(hover:hover){ .kpi.clickable:hover{transform:translateY(-3px);box-shadow:var(--hz-shx)} .kpi.clickable:active{transform:translateY(-1px) scale(.985)} }
.kpi .lb{font-size:12px;font-weight:700;color:var(--hz-sub)}

.mlg{font-size:12px;color:var(--hz-sub)}

.m3s{font-size:12px}

/* 그래프 금액 말풍선 (허브 lcShow 와 같은 움직임) */
.mc-tip{position:fixed;left:0;top:0;z-index:270;pointer-events:none;min-width:150px;padding:11px 14px 10px;border-radius:14px;background:rgba(255,255,255,.97);color:var(--hz-ink);

  transition:opacity .18s ease,transform .34s cubic-bezier(.22,.9,.24,1),visibility 0s linear .34s}

/* ── 화면 전환 — 카드가 살짝 떠오르며 차례로(허브 rise · 0.22초 · 40ms 간격). fill-mode 쓰지 않음 ── */
@keyframes mcRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.mc-enter .dcard,.mc-enter .kpi,.mc-enter .dhd,.mc-enter .rcard,.mc-enter .stat,.mc-enter .sect-label,.mc-enter .import-box{
  animation:mcRise .22s var(--hz-ease) backwards;animation-delay:calc(var(--mi,0) * 40ms)}
.mc-enter .cal-top,.mc-enter .cal-filterbar,.mc-enter #calBody{animation:mcRise .24s var(--hz-ease) backwards;animation-delay:calc(var(--mi,0) * 40ms)}

  background:rgba(240,246,239,.62);-webkit-backdrop-filter:saturate(1.2) blur(6px);backdrop-filter:saturate(1.2) blur(6px)}

.mc-sch-g::before{content:'';width:8px;height:8px;border-radius:3px;background:linear-gradient(150deg,var(--k1,#a8d3a0),var(--k2,#7fb877))}

.mc-sch-r .s-r1 .s-nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.mc-sch-r .s-tg{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:#eef3ec;color:var(--hz-sub)}
.mc-sch-r .s-tg.nosh{background:#f1f1f1;color:#7a7a7a}
.mc-sch-r .s-tg.go{background:#e3eff9;color:#255b8c}
.mc-sch-r .s-ic{flex:0 0 40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(150deg,#a6c8e2,#80a9cf);box-shadow:0 3px 8px -4px #80a9cf}

.mc-sch-empty{padding:26px 16px 30px;text-align:center;font-size:13px;font-weight:600;color:var(--hz-mute);line-height:1.7}

.mc-sch-ft{display:flex;gap:14px;flex-wrap:wrap;padding:9px 16px;border-top:1px solid #eef3ec;background:#fbfdfa;font-size:11.5px;font-weight:600;color:var(--hz-mute)}
.mc-sch-ft kbd{font:inherit;font-weight:800;color:var(--hz-sub);background:#fff;border:1px solid var(--hz-line);border-radius:5px;padding:0 5px;margin-right:3px}
@media(max-width:560px){

  .mc-sch-in input{font-size:17px}
  .mc-sch-ft{display:none}

}

/* ── 움직임 줄이기 ── */
@media(prefers-reduced-motion:reduce){
  .tn-logo .clvmark,.ov,.pn,.mc-sch.on,.mc-sch-box,.mc-sch-r,.mc.mc-flash,.m-bar.mc-flash,.t-block.mc-flash,
  #calBody.mc-slide-l .mg-wrap,#calBody.mc-slide-l .tg-wrap,#calBody.mc-slide-r .mg-wrap,#calBody.mc-slide-r .tg-wrap,
  .mc-enter .dcard,.mc-enter .kpi,.mc-enter .dhd,.mc-enter .rcard,.mc-enter .stat,.mc-enter .sect-label,.mc-enter .import-box,
  .mc-enter .cal-top,.mc-enter .cal-filterbar,.mc-enter #calBody{animation:none!important}
  .toast,.mc-tip,.mc-tip.on{transition:none}
  .kpi.clickable:hover,.kpi.clickable:active,.mini i:not(.pad):hover,.task:hover{transform:none}
}
@media(hover:none){ .mc:not(.tdc):not(.dim):hover{background:#fff;box-shadow:0 1px 2px rgba(28,38,32,.04),inset 0 0 0 1px rgba(227,233,224,.75)} .kpi.clickable:hover{transform:none} }
/* 보강 (같은 날) */
.tn-right .tn-search{order:-1}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;display:none}
.kpi.lv-d3::before{display:block;background:#f08c2a}
.kpi.lv-over::before{display:block;background:#e5484d}
.kpi.lv-over .dtag.dn{background:var(--hz-redbg);color:var(--hz-red)}

/* ── 보강 2 (같은 날) ── */
/* 종일·며칠짜리 막대: 칸 사이 간격이 생겨 옛 «이어 붙이기» 여백이 칸 밖으로 삐져나왔다 → 칸 안에서 둥글게 */
.m-span{margin-left:0;margin-right:0;border-radius:7px;padding-left:7px}
.m-span.m-cont{border-top-left-radius:2px;border-bottom-left-radius:2px;padding-left:6px}
/* 수익 추이: 그래프 상자가 «오른쪽 끝 정렬»을 물려받아 오른쪽에 좁게 몰리던 결함 → 카드 폭 전체 */
#pg-dash .rbs{align-items:stretch}
#pg-dash .rbarea,#pg-dash .rlabs{width:100%}
/* 숫자 카드 아이콘: 이모지 → 허브식 파스텔 네모 + 흰 선 아이콘 */
.kpis .kpi:nth-child(1){--c1:#a8d3a0;--c2:#7fb877}
.kpis .kpi:nth-child(2){--c1:#a6c8e2;--c2:#80a9cf}
.kpis .kpi:nth-child(3){--c1:#e3cf9d;--c2:#d0b97e}
.kpis .kpi:nth-child(4){--c1:#d3bfe0;--c2:#b79bd4}
.kpi .ic{background:linear-gradient(150deg,var(--c1,#cfdccb),var(--c2,#aabca6));color:#fff;
  box-shadow:0 3px 8px -3px var(--c2,#aabca6),inset 0 0 0 .5px rgba(255,255,255,.5)}
.kpi .ic svg.mi{width:16px;height:16px;stroke-width:2.2;filter:drop-shadow(0 1px 1px rgba(0,0,0,.12))}
/* 시간 일정 칩의 왼쪽 라벨 색 띠 — 인라인에서 CSS 로 옮김(폰에서 띠·여백을 얇게 하려고, 261004) */
.m-bar.m-tm{box-shadow:inset 3px 0 0 var(--lc);padding-left:7px}
.m-bar.m-tm:hover{box-shadow:inset 3px 0 0 var(--lc),0 3px 8px -5px rgba(28,38,32,.35)}
.m-em{font-style:normal}
.mc-meas .m-bar{width:max-content!important;max-width:none!important}
/* ── 보강 4 (261004) 폰: 일정 이름은 한 줄 — 「🙋🏻이서진님」(이모지+4글자)이 원래 글자 크기(10.5px) 그대로 들어가게
   (명진 «등록된 일정중 이름 정도 4~5글자는 한줄로»). 칸 바깥 여백·칸 사이·칩 여백·색 띠를 줄여 글자 자리 37px → 46px,
   상태 이모지는 이름 한 글자 크기로. 그래도 넘치는 칩(5글자+이모지 등)만 mc-ui 맞춤이 10 → 9.5 → 9px 로 줄인다 ── */
@media(max-width:560px){
  .mg-wrap{padding:0 3px 6px}
  .mg{gap:2px}
  .mc{padding:2px 1px;gap:2px}
  .mc>.dn{margin-left:3px}
  .m-bar{display:block;white-space:nowrap;text-overflow:ellipsis;word-break:normal;overflow-wrap:normal;
    font-size:10.5px;letter-spacing:-.4px;line-height:1.32;padding:1px 1px 1px 3px;border-radius:4px}
  .m-bar.m-tm{box-shadow:inset 2px 0 0 var(--lc);padding-left:4px}
  .m-bar.m-tm:hover{box-shadow:inset 2px 0 0 var(--lc)}
  .m-span,.m-span.m-cont{padding-left:3px}
  .m-em{font-size:.68em;letter-spacing:0;margin-right:-.3px;vertical-align:1px}
  .m-bar.m-fit1{font-size:10px!important;letter-spacing:-.5px}
  .m-bar.m-fit2{font-size:9.5px!important;letter-spacing:-.7px}
  .m-bar.m-fit3{font-size:9px!important;letter-spacing:-.8px}
}
/* ── 보강 3 (같은 날) ── */
/* 주 보기 왼쪽 위 모서리: 머리줄보다 짧아 회색 띠가 보이던 것 */
.tg-corner{height:auto!important;align-self:stretch}
/* 알림 카드: 기한 지난 카드를 분홍으로 칠하지 않고 흰 카드 + 빨간 왼쪽 띠(허브 «카드 면을 경고색으로 물들이지 않는다») */
.rcard[style*="fdf4f4"]{background:#fff!important;border-color:transparent!important;box-shadow:inset 4px 0 0 #e5484d,var(--hz-sh)!important}
/* 허브 앱 창(?embed=1) 안: 위쪽 바를 낮게 */
html.embed-cal .topnav{height:46px}
/* 화면 높이가 낮을 때(허브 앱 창·가로 폰): 일정 이름은 한 줄로 — 낮은 칸에서 두 줄이 잘리지 않게 */
@media(max-height:640px){
  .m-bar{display:block;-webkit-line-clamp:unset;white-space:nowrap;text-overflow:ellipsis;word-break:normal;line-height:1.3}
  .cal-top{padding-top:8px;padding-bottom:6px}
}
@media(max-width:360px){
  .cal-top .ml{font-size:16.5px}
  .nb{height:32px;min-width:32px}.nb.ar{width:32px}
  .vb{height:27px;padding:0 9px}
  .add-b{height:33px}
}
/* ── 보강 5 (261004) 배포 전 반대검토 반영 ── */
/* 가져오기 탭 위험 도구(전체 초기화 등)의 색 테두리 복원 — border:0 이 인라인 테두리 색을 지우고 있었다 */
.import-box[style*="border-color"]{border:1.5px solid}
/* 라벨 칩을 끝까지 민 뒤에도 브라우저 «뒤로가기»로 번지지 않게 */
.flt-chips{overscroll-behavior-x:contain}
/* 대시보드 숫자 상태색(원래 화면과 같은 뜻: 목표 미달·기한 지남 = 빨강, 수익 달성 = 초록) */
.kpi .v.v-dn{color:#c0483c}
.kpi .v.v-up{color:#2f6b3a}
/* ── 보강 6 (261004) 달(주·일) 넘김: 넘기기 전 화면 복사본이 겹침 층에서 밀려 나간다(#calBody 밖이라 달력 안 찾기에 안 섞임) ── */
#pg-cal{position:relative}
.mc-turnlayer{position:absolute;overflow:hidden;pointer-events:none;z-index:2}
/* ── 알림 카드 (261103 명진): 버튼은 오른쪽 — 폰을 한 손으로 스크롤할 때 왼쪽 버튼을 잘못 누르지 않게(PC도 오른쪽이 편함) ── */
#pg-alert .act-row.act-r{justify-content:flex-end;align-items:center}
/* 상담 고객 «내 계획 날짜» 칩(명진만) — 카드 오른쪽 위(왼쪽은 스크롤 자리라 비워 둠) · 가린 날짜 칸을 칩 위에 겹쳐 둔다(글자 16px 라 아이폰 확대 안 됨) */
.plan-chip{position:relative;display:inline-flex;align-items:center;gap:4px;min-height:34px;margin:-6px -6px -6px auto;padding:0 11px;border-radius:12px;border:1px dashed #c9d8c4;background:#fbfdf9;color:var(--hz-sub);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.plan-chip.on{border-style:solid;border-color:#cfe0c8;background:#eef6ea;color:#2f6b45}
.plan-chip input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;border:0;padding:0;margin:0;-webkit-appearance:none;appearance:none}
/* «보냈음 ✓» 바로 되돌리기 안내 — 이때만 누를 수 있다 */
.toast.undo{pointer-events:auto;display:flex;align-items:center;gap:12px;padding-right:10px}
.toast-undo{border:0;background:#eef6ea;color:#2f6b45;font-weight:800;font-size:12.5px;padding:8px 13px;border-radius:10px;cursor:pointer;white-space:nowrap}
/* 수빈 «먼저 볼 것» (261103) — ① 확인 필요 ② 빈 자리 한 화면 · 폰은 위아래, 넓은 화면은 나란히 · 누르는 것은 오른쪽 */
#pg-first{--dmint:#cfe9db;--dmint2:#a9dcc3;--dlime:#d8e85c;--dlime2:#eef3b8;--dgrn:#3f7a4a;--dredbg:#fdeceb;--dambbg:#fdf4e6;--dln:#eef2ed;overflow:auto}
.fl-wrap{max-width:1120px;width:100%;margin:0 auto;padding:20px clamp(14px,2.4vw,28px) 28px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
.fl-wrap .dhd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.fl-grid{display:grid;gap:14px;min-width:0}
@media(min-width:900px){.fl-grid{grid-template-columns:1fr 1fr;align-items:start}}
.fl-card{min-width:0}
.fl-todo{--k1:#efc2b3;--k2:#dfa28f}
.fl-free{--k1:#f3a99f;--k2:#e0564a;border:1.5px solid #f3cdc7;background:linear-gradient(180deg,#fff 0%,#fff8f6 100%)}
.fl-free.fl-calm{--k1:#a8d3a0;--k2:#7fb877;border-color:var(--bd);background:#fff}
.fl-sub{font-size:12px;color:var(--hz-mute,#687568);margin:-6px 0 10px;line-height:1.5}
.fl-sub b{color:#c0392b}
.fl-item{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:14px;padding:10px 10px 10px 12px;margin-bottom:8px;background:#fff}
.fl-item.over{border-color:#e0a3a3;background:#fdf4f4}
.fl-tx{flex:1;min-width:0}
.fl-bt{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.fl-bt .btn-ok,.fl-bt .btn-ng{min-height:38px;min-width:92px;padding:0 12px;font-size:12.5px}
.fl-bt .btn-ng{background:var(--bd);color:var(--mu);border:none}
.fl-bt .btn-ok[disabled]{opacity:.55;cursor:default;filter:grayscale(.35)}
.fl-it{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.fl-lb{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
.fl-k{font-size:11.5px;font-weight:800;color:var(--mu2)}
.fl-n{font-size:15px;font-weight:800;margin:4px 0 1px;color:var(--tx);overflow-wrap:anywhere}
.fl-w{font-size:12px;color:var(--mu2);line-height:1.55;overflow-wrap:anywhere}
.fl-w b{color:#c4763a;white-space:nowrap}
.fl-w .nw{white-space:nowrap}
.fl-item.over .fl-w b{color:#c0392b}
.fl-more{display:block;margin-left:auto;width:auto;max-width:100%;min-height:40px;padding:0 14px;border:1px dashed var(--bd2);border-radius:12px;background:var(--sf2);color:var(--mu2);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.fl-jump{align-self:center;flex:0 0 auto;min-height:38px;padding:0 14px;border:0;border-radius:999px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap}
.fl-jump.fl-red{background:#fde3e0;color:#b03a2e}.fl-jump.fl-yel{background:#fbefc4;color:#6b5200}
.fl-big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:2px 0 12px}
.fl-big b{font-size:46px;line-height:1;font-weight:800;color:#c0392b;letter-spacing:-1px}
.fl-big span{font-size:15px;font-weight:800;color:#9a3a30}
.fl-big.fl-yel b{color:#9a7a10}.fl-big.fl-yel span{color:#7a6010}
.fl-big.fl-ok b,.fl-big.fl-ok span{color:#3f7a4a}
.fl-big em{margin-left:auto;font-style:normal;font-size:12px;color:var(--hz-mute,#687568)}
.fl-free .mini{max-width:none}
.fl-free .mini i{height:40px;cursor:pointer}
.fl-free .mini i.pad{cursor:default}
.fl-free .flist{margin-top:12px}
.fl-free .fr{min-height:40px}
.fl-free .ft s{background:#fde3e0;color:#b03a2e}
.fl-free .ft s.ns{background:#fbefc4;color:#6b5200;box-shadow:inset 0 0 0 1px #f2c230}
.fl-see{margin-left:auto;flex:0 0 auto;min-height:38px;padding:0 12px;border:1px solid var(--bd);border-radius:12px;background:#fff;color:var(--mu2);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.fl-adj{font-style:normal;font-size:10.5px;font-weight:800;color:#7a6a2a;background:#f6efd6;border-radius:6px;padding:1px 6px;white-space:nowrap}
.fl-lock{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin:-4px 0 10px;font-size:12px;color:#9a3a30;text-align:right}
.fl-retry{min-height:38px;padding:0 14px;border:1px solid #e0a3a3;border-radius:12px;background:#fff;color:#9a3a30;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit}
.fl-go{display:flex;justify-content:flex-end}
.fl-go .btn-ok{flex:0 0 auto}
.fl-gobtn{min-height:48px;padding:0 26px;font-size:14px}
/* NYC 대관 견적서 (261103 운영-003 19) — 누르는 것은 오른쪽, 입력은 16px(아이폰 확대 방지) */
.det-qz{align-items:center}
.qz-open{margin-left:auto;min-height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--bd2);background:#fff;color:var(--tx);font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
.qz{display:flex;flex-direction:column;gap:8px}
.qz-who{font-size:12.5px;color:var(--mu2);margin-bottom:2px;line-height:1.5}
.qz-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:40px}
.qz-l{font-size:13px;font-weight:700;color:var(--tx);min-width:88px}
.qz-v{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.qz-v input[type=time],.qz-v input[type=date],.qz-v input[type=text],.qz-v select{height:40px;padding:0 10px;border:1px solid var(--bd);border-radius:10px;background:var(--sf2);color:var(--tx);font-size:16px;font-family:inherit;box-sizing:border-box;min-width:0}
.qz-v input[type=text]{width:132px;text-align:right}
.qz-v select{max-width:min(280px,66vw);padding-right:30px;text-overflow:ellipsis}
.qz-step{width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);font-size:18px;line-height:1;font-weight:700;cursor:pointer;font-family:inherit}
.qz-n{min-width:40px;text-align:center;font-size:13px}
.qz-note{font-size:11px;color:var(--mu);text-align:right;margin-top:-4px;line-height:1.5}
.qz-prev{margin-top:6px;border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:#f7f6f2;min-height:120px}
.qz-prev img{display:block;width:100%;height:auto}
.qz-prev img:not([src]),.qz-prev.qz-wait img{display:none}
.qz-prev.qz-wait::after{content:'대관 공간과 시간을 정하면 견적서가 여기 보여요';display:block;padding:44px 16px;text-align:center;font-size:12.5px;color:var(--mu);line-height:1.6}
.qz-nd{margin-left:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--bd2);background:#fff;color:var(--tx);font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;vertical-align:middle}
.qz-fn{font-size:11px;color:var(--mu);word-break:break-all;text-align:right}
.qz-act{justify-content:flex-end}
.qz-act .btn-ok,.qz-act .btn-ng{flex:0 0 auto}
.qz-act .btn-ok[disabled]{opacity:.5;cursor:default}
.qz-back{background:var(--bd)!important;color:var(--mu)!important;border:none!important}
/* 수익 추이 — 종류별로 쌓은 막대 (261103): 아래부터 촬영 예약비 · 사진 구매 · 추가 요청, 조각 사이 흰 틈 2px */
.rstk{display:flex;flex-direction:column-reverse;width:100%}
.rstk .sg{display:block;width:100%;flex:0 0 auto;box-sizing:border-box;transition:filter .14s}
.rstk .sg+.sg{border-bottom:2px solid #fff}
.rstk .sg:last-child{border-radius:5px 5px 0 0}
.rstk .sg0{background:#e3ebe1}
.rcol:hover .sg,.rcol.on .sg{filter:saturate(1.15) brightness(.96)}
.rlab.cur{color:var(--hz-ink,#1c2620);font-weight:800}
.mlg.rlg{margin-top:12px;gap:14px}
.mlg.rlg i{border-radius:50%}
.mc-tip .ts{display:flex;gap:12px;margin:0 0 1px 16px;font-size:11px;font-weight:600;color:var(--hz-mute);line-height:1.5}
.mc-tip .ts b{margin-left:auto;padding-left:0;font-weight:700;color:var(--hz-sub)}
.mc-tip .ts.tw{color:#b0662a}
.mc-tip .tr.tt{margin-top:4px;padding-top:6px;border-top:1px solid #e9efe6;color:var(--hz-ink)}

<script>
// ── 유틸 (최상단 정의, UTC 버그 방지) ──
function fd(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return`${y}-${m}-${dd}`;}
function parseDS(ds){const[y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d);}
function dowOf(ds){return parseDS(ds).getDay();} // 0=일,1=월,...,6=토
function pad(n){return String(n).padStart(2,'0');}
function mkd(n){const d=new Date(TODAY);d.setDate(TODAY.getDate()+n);return fd(d);}
function addH(t,h){const[hh,mm]=t.split(':').map(Number);const tot=hh*60+mm+h*60;return`${pad(Math.floor(tot/60)%24)}:${pad(tot%60)}`;}
function addDays(ds,n){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(ds));const d=m?new Date(+m[1],+m[2]-1,+m[3]):new Date(ds);d.setDate(d.getDate()+n);return fd(d);}   // (261106 운영-003 20 저장엔진 v2) 시간대 무관

// ── 상수 ──
const TODAY=new Date(), TSTR=fd(TODAY);
const STORAGE_KEY='maydly_events_v2';
const STORAGE_REQ_KEY='maydly_requests_v2';
const STORAGE_GCAL_KEY='maydly_gcal_admin_v1';

// ── GitHub 저장 (260716 v6.0) ──
// Netlify 서버 함수(/api/events) 대신, 관리자 화면이 GitHub API로 직접 저장한다.
//  · 원본(events.json, 고객명·연락처 포함) → 비공개 저장소
//  · 공개용(public.json, 개인정보 뺀 가용시간만) → 공개 저장소(고객 페이지가 읽음)
// 토큰은 소스에 넣지 않는다. 명진이 관리자 화면에 1회 입력 → 이 기기 localStorage에만 저장.
const GH_OWNER='maydly';
const GH_DATA  ={repo:'maydly-cal-data', path:'events.json'};  // 비공개 원본
const GH_PUBLIC={repo:'maydly-cal',      path:'public.json'};  // 공개 (고객이 읽음)
const GH_TOKEN_KEY='maydly_gh_token';
let _ghToken=localStorage.getItem(GH_TOKEN_KEY)||'';
const _ghSha={};   // 경로별 최신 sha 기억 (PUT 시 필요)

function ghHeaders(){return{Authorization:'Bearer '+_ghToken,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};}
// UTF-8 안전 base64 (한글 깨짐 방지)
function b64encode(str){return btoa(unescape(encodeURIComponent(str)));}
function b64decode(b64){return decodeURIComponent(escape(atob(b64.replace(/\n/g,''))));}

// ── 저장 계층: GitHub 토큰 → Firestore(구글 로그인)로 교체 ──
// GH_DATA(비공개 예약 전체) → Firestore 문서 mj_cal/events
// GH_PUBLIC(고객 공개 가용여부)   → Firestore 문서 cal_public/schedule
function fsPathFor(cfg){ return cfg===GH_PUBLIC ? 'cal_public/schedule' : 'mj_cal/events'; }
async function ghGet(cfg){
  const data=await window.MJCAL.get(fsPathFor(cfg));   // {events,savedAt} 또는 공개객체, 없으면 null
  return {data, sha:null};
}
async function ghPut(cfg,obj){
  await window.MJCAL.put(fsPathFor(cfg), obj);
}
function hasToken(){ return !!(window.MJCAL && window.MJCAL.user); }   // 로그인=연결
function saveGhToken(t){ /* 토큰 방식 폐지 — 구글 로그인 사용 */ }

// ── 구글 캘린더 설정 ──
const GCAL_MINJIN_KEYWORDS=['명진'];
const GCAL_CAL_IDS=[
  'dcba34499541fc3f1eed2a55fc82633f0bdc28ca369d81dda4785e7e830bdb45@group.calendar.google.com',
  '9fcd35edcb1b4b433445d0bb1e2d0c5cbb312ca9f87830d0e9b9b2321030b54e@group.calendar.google.com',
];

// gcalEvents: [{date:'2026-05-15', allDay:true}, ...]
let gcalEvents=[];
function loadGcalCache(){
  try{const raw=sessionStorage.getItem(STORAGE_GCAL_KEY);if(raw){const d=JSON.parse(raw);gcalEvents=d.events||[];}}catch(e){}
}
function saveGcalCache(events){
  gcalEvents=events;
  try{sessionStorage.setItem(STORAGE_GCAL_KEY,JSON.stringify({events,at:Date.now()}));}catch(e){}
}
loadGcalCache();

function nowStr(){return new Date().toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}

// ── 라벨 (TimeTree 라벨 목록 기준) ──
const LABELS={
  studio_m:{name:'남스튜디오',color:'#4a9a6a'},
  studio_f:{name:'여스튜디오',color:'#e0608a'},
  outdoor:{name:'야외',color:'#4a8abf'},
  studio_pay:{name:'스튜디오페이',color:'#f5c400',tc:'#3a2f00'},   // (260904) 여스튜디오와 헷갈려 노랑으로 — 밝은 색이라 글자는 진하게
  outdoor_pay:{name:'야외페이',color:'#1a237e'},                    // (260904) 남스튜디오와 헷갈려 남색으로
  pa_shoot:{name:'PA촬영',color:'#7050c0'},

  suvin:{name:'수빈',color:'#e08a3c'},

function addDue(ds,due){
  const d=parseDS(ds);
  if(due.m){
    // 월말 보정 — 1/31 + 1달은 3/3이 아니라 2월 말일로
    const day=d.getDate();
    d.setDate(1);d.setMonth(d.getMonth()+due.m);
    const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    d.setDate(Math.min(day,last));
  }
  if(due.w)d.setDate(d.getDate()+due.w*7);
  return fd(d);
}
function dDiff(from,to){return Math.round((parseDS(to)-parseDS(from))/86400000);}

//   고객 기한 ~11/9 = 그대로 · 11/10~11/16 = 11/9 까지(첫 주 여유) · 11/17 부터 = 7일 전

const SEND_EARLY_DAYS=7, SEND_EARLY_FROM='2026-11-03';
function dsShift(ds,n){const d=parseDS(ds);d.setDate(d.getDate()+n);return fd(d);}

// 줄 세우기(검토·코덱스 반영) — ① 고객 기한(긴급은 약속 기한, 상담 고객은 원래 기한)까지 이미 지난 건: 많이 지난 순

// 지금 챙겨야 할 일 — 의상확인(촬영 D-2) / 기본 보정본 전달 / 구매분 전달
function buildAlerts(){
  const today=TSTR,out=[];
  maydlyEvents.forEach(e=>{
    if(isExt(e)||!stActive(e.status))return;
    // 의상확인 — 촬영 라벨만, 아직 안 지난 촬영만 (오늘 ~ OUTFIT_LEAD일 뒤).

    if(e.status==='booked'&&DELIV_LABELS.includes(e.label)){
      const left=dDiff(today,e.date);

// 종일 일정 중 '하루를 통째로 막는' 라벨 — 휴무·휴일. (종일 '촬영'은 시간을 모르므로 겹침 판정에서 뺀다)
const DAY_BLOCK_LABELS=['rest','holiday'];
function isDayBlock(e){return !!e&&!!e.allDay&&DAY_BLOCK_LABELS.includes(e.label);}
// 일정의 시작·끝(ms). 종일은 그날 00:00부터 일수만큼.
function evSpan(e){
  const st=e.allDay?'00:00':(e.time||'00:00');
  const hours=e.allDay?Math.max(1,Math.round((e.dur||24)/24))*24:(e.dur||1);
  const s=new Date(e.date+'T'+st).getTime();
  return{s,t:s+hours*3600000};
}
// 두 일정이 겹치는가.
// - 휴무·휴일 종일이 한쪽에 있으면 → 그날 전체를 막으므로 날짜만 겹치면 겹침
// - 그 외 종일(시간 미상 촬영)은 겹침 판정에서 제외
// - 둘 다 시간이 있으면 → 시간대 비교
function evOverlap(a,b){
  const sa=evSpan(a),sb=evSpan(b);
  if(isDayBlock(a)||isDayBlock(b))return sa.s<sb.t&&sb.s<sa.t;
  if(a.allDay||b.allDay)return false;
  return sa.s<sb.t&&sb.s<sa.t;
}
// cand와 겹치는 기존 일정. 노쇼·취소는 제외. 외부 캘린더(수빈)도 제외하되, 휴일 종일은 하루 차단으로 본다.
function findOverlaps(cand,excludeId){
  return maydlyEvents.filter(e=>{
    if(e.id===excludeId)return false;
    if(!v2OvLive(e))return false;   // (261106 운영-003 20 저장엔진 v2) 겹침 띠와 같은 기준(노쇼·취소, 휴무 아닌 수빈 일정 제외)
    return evOverlap(cand,e)||v2RepOverlap(cand,e);   // (261106 운영-003 20 저장엔진 v2) 반복 일정 펼침
  }).sort((x,y)=>(x.date+(x.time||'')).localeCompare(y.date+(y.time||'')));
}
function v2RepOverlap(a,b){
  const ra=!!(a&&a.repeat&&a.repeat!=='none'),rb=!!(b&&b.repeat&&b.repeat!=='none');
  if(!ra&&!rb)return false;
  const sp=function(e){return e.allDay?Math.max(1,Math.round((e.dur||24)/24)):2;};
  const at=function(e,ds){return ds===e.date?e:Object.assign({},e,{date:ds});};
  if(!rb)return v2Occ(a,addDays(b.date,-sp(a)),addDays(b.date,sp(b))).some(function(ds){return ds!==a.date&&evOverlap(at(a,ds),b);});
  if(!ra)return v2Occ(b,addDays(a.date,-sp(b)),addDays(a.date,sp(a))).some(function(ds){return ds!==b.date&&evOverlap(a,at(b,ds));});
  const from=a.date>b.date?a.date:b.date,to=addDays(from,185),ob=v2Occ(b,addDays(from,-3),addDays(to,3));
  return v2Occ(a,from,to).some(function(da){return ob.some(function(db){return Math.abs(dDiff(da,db))<=3&&evOverlap(at(a,da),at(b,db));});});
}
// 가져오기(텍스트·JSON·iCal)는 한 번에 여러 건을 넣으므로 저장을 막지 않는다.
// 대신 방금 넣은 것 중 기존 일정과 시간이 겹치는 게 몇 건인지 세어 알려준다.
function countImportConflicts(ids){
  const set=new Set(ids);
  return maydlyEvents.filter(e=>set.has(e.id)&&findOverlaps(e,e.id).length>0).length;
}
function conflictNote(ids){
  const n=countImportConflicts(ids);
  return n?` ⚠ 그중 ${n}건은 기존 일정과 시간이 겹칩니다 (캘린더에서 확인하세요)`:'';
}

// ── 종일 촬영 안내 (260714 v5.2) ──
// 종일 촬영은 시간을 몰라 겹침 판정을 못 한다. 막지는 않되, 그 날 종일 촬영이 있다는 사실만 알려준다.
function coversDay(e,ds){
  const days=Math.max(1,Math.round((e.dur||24)/24));
  return ds>=e.date&&ds<=addDays(e.date,days-1);
}
function allDayShoots(ds){
  return maydlyEvents.filter(e=>e.allDay&&!isDayBlock(e)&&!isExt(e)&&stActive(e.status)&&coversDay(e,ds));
}

function showOverlapWarn(list,forceJs){
  const onlyRest=list.every(isDayBlock);
  const rows=list.map(e=>{
    const L=LABELS[e.label]||{name:'기타',color:'#9a9a9a'};
    const when=e.allDay?'종일':`${(e.time||'').slice(0,5)} – ${addH(e.time||'00:00',Math.min(e.dur||1,12))}`;
    return`<div style="display:flex;gap:6px;align-items:center;font-size:11px;color:var(--tx);padding:3px 0">
      <span style="width:7px;height:7px;border-radius:50%;background:${L.color};flex-shrink:0"></span>
      <b>${esc(e.client||L.name)}</b><span style="color:var(--mu)">${e.date} ${when}</span></div>`;
  }).join('');
  const title=onlyRest?'쉬는 날인데요?':'⚠ 시간이 겹치는 일정이 있습니다';
  const guide=onlyRest?'그래도 등록하려면 아래 버튼을 누르세요.':'시간을 고치고 다시 저장하세요. 겹치는 줄 알고 등록하려면 아래 버튼을 누르세요.';
  const head=onlyRest
    ?`<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        ${restChar()}
        <div>
          <div style="font-size:13px;font-weight:800;color:#a85d20">${title}</div>
          <div style="font-size:10px;color:#b98a5e;margin-top:2px">오늘은 쉬기로 한 날이에요…</div>
        </div>
      </div>`
    :`<div style="font-size:12px;font-weight:800;color:#a85d20;margin-bottom:6px">${title}</div>`;
  const html=`<div id="ovlWarn" style="border:1px solid #d98c4a;background:#fdf3e8;border-radius:10px;padding:12px;margin-bottom:12px">
    ${head}
    ${rows}
    <div style="font-size:10px;color:var(--mu);margin-top:7px">${guide}</div>
    <button class="sub-btn" style="margin-top:8px;background:#d98c4a" onclick="${forceJs}">${onlyRest?'알고 있어요, 그래도 등록':'겹치는 걸 알고 등록'}</button>

}

// ── 데이터 (SAMPLE_EVENTS는 빈 배열, 버전 tt_v4로 기존 캐시 초기화) ──
const DATA_VERSION='tt_v9';
const SAMPLE_EVENTS=[]; // 데이터는 GitHub(비공개)에서 로드 — 임베드 제거(공개 안전)

function loadEvents(){
  try{
    const ver=localStorage.getItem('maydly_data_ver');
    if(ver===DATA_VERSION){
      const raw=localStorage.getItem(STORAGE_KEY);
      if(raw){const d=JSON.parse(raw);if(Array.isArray(d))return d;}
    }
    // 버전 불일치 → 일정 캐시만 새로 시드. (localStorage.clear() 금지 — 토큰·PIN·예약요청까지 지워짐)
    const fresh=JSON.parse(JSON.stringify(SAMPLE_EVENTS));
    localStorage.setItem(STORAGE_KEY,JSON.stringify(fresh));
    localStorage.setItem('maydly_data_ver',DATA_VERSION);
    return fresh;
  }catch(e){}
  return[];
}

function v2Rand(n){const c='abcdefghijklmnopqrstuvwxyz0123456789';let s='';try{const a=new Uint8Array(n);crypto.getRandomValues(a);for(let i=0;i<n;i++)s+=c.charAt(a[i]%36);}catch(e){for(let i=0;i<n;i++)s+=c.charAt(Math.floor(Math.random()*36));}return s;}
function v2Uid(){return v2Rand(12);}
function v2OpId(){return v2Rand(10);}
function v2Key(e){return e?(e.uid?'u:'+e.uid:'#'+e.id):'';}
function v2Clone(o){return o===undefined?undefined:JSON.parse(JSON.stringify(o));}
function v2Sort(v){
  if(Array.isArray(v))return v.map(v2Sort);
  if(v&&typeof v==='object'){const o={};Object.keys(v).sort().forEach(function(k){if(v[k]!==undefined)o[k]=v2Sort(v[k]);});return o;}

function v2TakeOver(k){

  const n=v2TakeRec(r);

// (261107 운영-003 20 저장엔진 v2) 예비 저장소(IndexedDB)에 남은 다른 화면 대기열도 이어받는다(기기 저장소가 가득 찼던 화면)
function v2AdoptIdb(){
  if(!window.indexedDB)return Promise.resolve(0);
  const mine=v2ObKey();
  return v2IdbAll().then(function(list){
    list=list.filter(function(x){return x&&x.k&&x.k!==mine&&x.k.indexOf(V2.obPre)===0&&x.r&&Array.isArray(x.r.ops);});
    return list.reduce(function(p,x){return p.then(function(n){
      const t=x.k.slice(V2.obPre.length);
      const take=function(){
        if(!x.r.ops.some(function(o){return o&&o.id&&!v2OpDone(o);}))return v2IdbDel(x.k).then(function(){return 0;});   // (261108 운영-003 20 저장엔진 v2) 모두 이미 반영됨 — 자리만 치움
        const m=v2TakeRec(x.r);
        const ok=v2ObWrite();
        const keep=ok?Promise.resolve(true):(V2.idbHas?v2IdbPut(mine,JSON.parse(JSON.stringify({v:2,hb:Date.now(),closed:0,dev:V2.dev,ops:V2.ob}))):Promise.resolve(false));
        return keep.then(function(durable){if(durable)return v2IdbDel(x.k).then(function(){return m;});return m;});
      };
      const go=navigator.locks&&navigator.locks.request
        ?navigator.locks.request('mjcal_tab::'+t,{ifAvailable:true},function(lock){return lock?take():0;}).catch(function(){return 0;})
        :Promise.resolve((x.r.closed||Date.now()-(+x.r.hb||0)>90000)?take():0);
      return go.then(function(m){return n+(m||0);});
    });},Promise.resolve(0));
  },function(){return 0;});
}

// ── 화면 캐시(v2 전용 키) — 옛 판이 쓰는 maydly_events_v2 와 따로 둔다(옛 판이 못 올린 것을 구출하려고) ──
// (261107 운영-003 20 저장엔진 v2) 첫 화면용 캐시(일정 전체 ≈330KB)는 0.4초 모아서 쓴다 — 다른 기기 변경을 받을 때마다 바로 쓰면 화면이 멈췄다.
// 변경 자체는 대기열(op)에 먼저 바로 적으므로 캐시가 늦어도 잃는 것이 없다. 화면을 내리거나 닫을 때는 바로 쓴다.
function v2CacheWrite(now){
  clearTimeout(V2.cacheT);V2.cacheDirty=true;
  if(!now){V2.cacheT=setTimeout(function(){v2CacheWrite(true);},400);return;}
  V2.cacheDirty=false;
  if(V2.obErr)return;   // 기기 저장소가 가득 찼으면 대기열 자리를 먼저
  v2ResEnsure();   // (261107 운영-003 20 저장엔진 v2) 예비 칸이 캐시보다 먼저(캐시는 다시 만들 수 있음)
  if(v2NoData())return;   // (261108 운영-003 20 저장엔진 v2) 아직 서버 판을 못 받은 «모름» 상태에서는 화면 사본을 적지 않는다 — 몇 건짜리 사본이 «받은 판»처럼 남아 다음에 빈 자리로 보이지 않게
  try{localStorage.setItem(V2.cacheKey,JSON.stringify({v:2,rev:V2.rev,hist:V2.hist||'',sig:V2.sig||'',line:V2.line||'',at:Date.now(),events:maydlyEvents.filter(function(e){return e&&!(e.id>=90000);})}));}
  catch(e){/* 대기열이 먼저 — 캐시는 못 써도 됨 */}
}
function v2CacheFlush(){if(V2.cacheDirty)v2CacheWrite(true);}
function v2InitEvents(){

  try{const raw=localStorage.getItem(V2.cacheKey);if(raw){const c=JSON.parse(raw);if(c&&c.v===2&&Array.isArray(c.events)){ev=c.events;V2.cache0={rev:Number.isInteger(c.rev)?c.rev:0,hist:typeof c.hist==='string'?c.hist:'',line:typeof c.line==='string'?c.line:'',n:c.events.length};}}}catch(e){}
  if(!ev){ev=loadEvents();V2.noBase=!(Array.isArray(ev)&&ev.length);}   // (261108 운영-003 20 저장엔진 v2) 화면 사본도 옛 캐시도 없음 — 첫 서버 판 전까지는 «모름»
  try{const ops=v2AllDeviceOps();if(ops.length)ev=v2Apply(ev,ops,{mode:'view'}).events;}catch(e){}

}
// (261108 운영-003 20 저장엔진 v2) 이 기기에 아직 불러온 일정이 없음(서버 판도 화면 사본도 없음) — 빈 칸을 «빈 자리»·«할 일 없음»으로 보이지 않는다
function v2NoData(){try{return !!(V2.noBase&&!V2.synced);}catch(e){return false;}}
function v2UnkTxt(){return '이 기기에 아직 불러온 일정이 없어요 — 연결되면 보여요';}
// 새 일정의 임시 번호는 음수 — 서버 번호와 겹치지 않는다(서버가 올릴 때 «최대+1»로 매김).
// 탭마다 시작점을 무작위로 잡아 같은 기기의 다른 탭과도 겹치지 않게 하고, 쓴 번호는 다시 쓰지 않는다(아래로만 센다).
function v2InitTempId(){
  const used=new Set();
  try{maydlyEvents.forEach(function(e){if(e&&Number.isInteger(e.id)&&e.id<0)used.add(e.id);});}catch(e){}
  V2.ob.concat(v2AllDeviceOps()).forEach(function(o){if(o&&o.k==='add'&&o.ev&&Number.isInteger(o.ev.id)&&o.ev.id<0)used.add(o.ev.id);});
  let m=V2.tmpMin&&V2.tmpMin<0?V2.tmpMin-1:-(100000+Math.floor(Math.random()*900000000));
  while(used.has(m)||used.has(m-1))m-=7;
  V2.tmpMin=m;return m;
}
function v2NewId(){
  if(!(V2.tmpMin<0))return v2InitTempId();
  let m=V2.tmpMin-1;
  while(maydlyEvents.some(function(e){return e&&e.id===m;}))m--;
  V2.tmpMin=m;return m;
}
function v2FindKey(k){if(!k)return null;for(let i=0;i<maydlyEvents.length;i++){const e=maydlyEvents[i];if(e&&v2Key(e)===k)return e;}return null;}
function v2MapOf(list){const m=new Map();(list||[]).forEach(function(e){if(e&&!(e.id>=90000)){const k=v2Key(e);if(!m.has(k))m.set(k,v2Clone(e));}});return m;}

// ── 바뀐 것 → op (모든 일정 변경의 공통 길 saveEvents 가 부른다) ──
function v2DiffOps(grp){
  const now=Date.now(),ops=[],seen=new Set(),B=V2.base;
  for(let i=0;i<maydlyEvents.length;i++){
    const e=maydlyEvents[i];if(!e||e.id>=90000)continue;
    let k=v2Key(e);
    if(!B.has(k)&&!e.uid){e.uid=v2Uid();k='u:'+e.uid;}
    if(seen.has(k)){console.warn('v2: 같은 열쇠 일정이 둘 — 건너뜀',k);continue;}
    seen.add(k);
    const b=B.get(k);
    if(!b){ops.push({id:v2OpId(),k:'add',key:k,grp:grp,t:now,ev:v2Clone(e)});continue;}
    const ks=new Set(Object.keys(b).concat(Object.keys(e)));ks.delete('id');
    ks.forEach(function(f){
      const bv=b[f],cv=e[f];
      if(bv===cv)return;
      if(bv===undefined&&cv===undefined)return;
      if(bv&&cv&&typeof bv==='object'&&typeof cv==='object'&&v2Canon(bv)===v2Canon(cv))return;
      ops.push({id:v2OpId(),k:'set',key:k,grp:grp,t:now,f:f,b:v2Val(bv),v:v2Val(cv)});
    });
  }
  B.forEach(function(b,k){if(!seen.has(k))ops.push({id:v2OpId(),k:'del',key:k,grp:grp,t:now,b:v2EvCanon(b)});});
  if(V2.undoRec){const u=V2.undoRec;V2.undoRec=null;if(Date.now()-(u.t||0)<3000)v2UndoRecord(u,ops);}
  return ops;
}
// 화면에서 직접 만든 op(편집 창 «바꾼 칸만»·겹침 «확인했어요») — 지금 일정과 그림자 둘 다에 반영
function v2PushOps(e,ops){
  if(!e||!ops.length)return;
  const grp=v2Rand(6),key=v2Key(e),now=Date.now(),be=V2.base.get(key);
  ops.forEach(function(o){
    o.id=v2OpId();o.key=key;o.grp=grp;o.t=now;
    if(o.k==='set'){v2SetField(e,o.f,o.v);if(be)v2SetField(be,o.f,o.v);}
    else if(o.k==='uni'){const u=function(a){a=Array.isArray(a)?a.slice():[];(o.add||[]).forEach(function(x){if(a.indexOf(x)<0)a.push(x);});return a;};e[o.f]=u(e[o.f]);if(be)be[o.f]=u(be[o.f]);}
    V2.ob.push(o);
  });
  v2ObWrite();
  V2.viewVer++;V2.ovlMemo=null;   // (261107 운영-003 20 저장엔진 v2) 화면 기록이 바뀜 — 겹침 계산을 새로(«내 값으로 다시»·«옮기기»로 시간이 바뀌어도 옛 계산에 머물던 것)
  v2BandNow();
}
function v2BandNow(){const b=document.getElementById('v2Band');if(b&&!b.hidden)v2Band();}
function saveEvents(){

  const ops=v2DiffOps(v2Rand(6));

// ── 올리기(트랜잭션) ──
function v2Commit(batch,force){

    const s=await t.get('mj_cal/events');
    V2.txReadAt=v2Mono();   // (261107 운영-003 20 저장엔진 v2) 읽기를 마친 때 — 매달림 감시가 «읽는 중»과 «쓰고 응답을 기다리는 중»을 따로 잰다(계산에는 안 씀)

    const srv=mergeHoliday(list.map(v2Clone));
    const idHi0=d&&Number.isInteger(d.idHi)&&d.idHi>0?d.idHi:0;   // (261107 운영-003 20 저장엔진 v2) 지금까지 준 가장 큰 번호
    // (261107 운영-003 20 저장엔진 v2) 기록의 «줄 표식» — 옛 판이 통째로 덮은 문서(표식 없음)·빈 문서 위에 처음 쓸 때 새로 만들고, 그 뒤 커밋은 그대로 옮겨 쓴다.
    //   덮인 뒤 판 번호가 0부터 다시 올라 기기 판보다 커져도, 표식이 다르면 «덮임»으로 알아본다(판 번호만 보던 것)

    // (261108 운영-003 20 저장엔진 v2) 하루 한 번 «공개표 날짜 맞춤»(force 'day')은 서버가 이미 오늘 공개표·오늘 백업이면 쓰지 않는다 — 날짜가 바뀐 뒤 두 기기가 거의 같이 열면
    //   늦은 기기가 내용이 같은 커밋을 한 번 더(겨룸에서 져도 다시 해서) 써 이력 한 장과 문서 받기(≈33만 바이트 × 열린 기기)가 늘었다. «고객페이지 갱신»('manual')은 그대로 쓴다
    const dayOk=force==='day'&&!!d&&d.pubDay===day&&d.backupDay===dayKey&&minVer>=V2.minVer;
    if(!res.changed&&(!force||dayOk)&&!fix.length){const nw={rev:rev,hist:(d&&d.hist)||'',results:res.results,events:evOut,noWrite:true,dayOk:dayOk,opw:d&&d.opw,meta:v2MetaOf(d),base:rev,baseHist:(d&&d.hist)||'',fixN:0,sig:v2Sig(d),baseSig:v2Sig(d),tomb:d&&typeof d.tomb==='string'?d.tomb:'',line:line0,baseLine:line0};
      // (261108 운영-003 20 저장엔진 v2) 날짜 맞춤만 하려던 시도(올릴 변경 없음)인데 서버가 이미 오늘이면 트랜잭션을 여기서 그만둔다 — 그냥 끝내면 SDK 가
      //   읽은 판 확인용 빈 커밋을 한 번 더 보낸다(문서는 안 바뀌지만 «따로 올린 커밋»). 읽은 판은 결과로 넘겨 화면을 맞춘다(쓰기 없는 커밋과 같은 길)
      if(dayOk&&!batch.length){const er=v2Err('day-done','오늘 날짜로 이미 맞춰짐');er.res=nw;throw er;}

    const backup=!!d&&d.backupDay!==dayKey;

      idHi:Math.max(idHi0,res.idHi||0),line:line};

function v2DayCheck(force){

function v2ConfVerify(){

function v2ConfDropIds(ids){v2ConfPut([],new Set(ids));v2Note();}

function v2ConfRedo(i){

// ── 겹친 예약 안전망(모든 기기에 같은 것 — 저장 없이 매번 계산) ──
function v2Occ(e,from,to){
  const out=[];
  if(!e.repeat||e.repeat==='none'){if(e.date>=from&&e.date<=to)out.push(e.date);return out;}
  const origin=new Date(e.date+'T00:00:00');let cur=new Date(origin);
  if(e.date>=from&&e.date<=to)out.push(e.date);
  for(let g=0;g<800;g++){const nx=nextOccurrence(cur,e.repeat,origin);if(!nx)break;const ds=fd(nx);if(ds>to)break;if(ds>=from)out.push(ds);cur=nx;}
  return out;
}
function v2Covers(e,ds){
  if(e.allDay){const n=Math.max(1,Math.round((e.dur||24)/24));const a=[];for(let k=0;k<n;k++)a.push(addDays(ds,k));return a;}
  const hh=(e.time||'00:00').split(':').map(Number),end=hh[0]+(hh[1]||0)/60+(e.dur||1);
  return end>24?[ds,addDays(ds,1)]:[ds];
}
function v2Overlaps(){
  if(V2.ovlMemo&&V2.ovlMemo.v===V2.viewVer&&V2.ovlMemo.d===todayStr())return V2.ovlMemo.r;
  const from=todayStr(),to=addDays(from,185),bucket=new Map(),pairs=new Map();
  maydlyEvents.forEach(function(e){
    if(!v2OvLive(e))return;   // (261106 운영-003 20 저장엔진 v2) findOverlaps 와 같은 기준(종일 촬영은 휴무와만 겹침 — evOverlap 그대로)
    v2Occ(e,addDays(from,-3),to).forEach(function(ds){v2Covers(e,ds).forEach(function(d){if(d<from||d>to)return;let l=bucket.get(d);if(!l){l=[];bucket.set(d,l);}l.push({e:e,ds:ds});});});
  });
  bucket.forEach(function(l,d){
    for(let i=0;i<l.length;i++)for(let j=i+1;j<l.length;j++){
      const a=l[i],b=l[j];if(a.e===b.e)continue;
      const A=a.ds===a.e.date?a.e:Object.assign({},a.e,{date:a.ds}),B=b.ds===b.e.date?b.e:Object.assign({},b.e,{date:b.ds});
      if(!evOverlap(A,B))continue;
      const ka=v2Key(a.e),kb=v2Key(b.e);
      if((a.e.ovOK||[]).indexOf(kb)>=0||(b.e.ovOK||[]).indexOf(ka)>=0)continue;
      const pk=ka<kb?ka+'|'+kb:kb+'|'+ka;
      if(!pairs.has(pk))pairs.set(pk,{a:A.date<=B.date?a.e:b.e,b:A.date<=B.date?b.e:a.e,ds:d});
    }
  });
  const r=Array.from(pairs.values()).sort(function(x,y){return (x.ds+(x.a.time||'')).localeCompare(y.ds+(y.a.time||''));});
  V2.ovlMemo={v:V2.viewVer,d:todayStr(),r:r};
  return r;
}
function v2OvlPk(p){const a=v2Key(p.a),b=v2Key(p.b);return a<b?a+'|'+b:b+'|'+a;}
function v2OvlOpen(keep){
  let ov=v2Overlaps();
  if(!ov.length){v2OvClose();v2Note();return;}
  if(keep&&V2.ovlShown&&V2.ovlShown.length){   // 열린 창을 고칠 때는 보던 줄 차례를 지키고 새 줄은 아래에(손가락 밑 줄이 바뀌지 않게)
    const at={};V2.ovlShown.forEach(function(x,i){at[x.pk]=i;});
    ov=ov.map(function(p,i){return{p:p,o:at[v2OvlPk(p)]!=null?at[v2OvlPk(p)]:1e6+i};}).sort(function(x,y){return x.o-y.o;}).map(function(x){return x.p;});

    return '<div class="v2r"'+v2Row('o:'+v2OvlPk(p))+'><div class="v2r-t"><b>'+v2Md(p.ds)+' ('+['일','월','화','수','목','금','토'][dowOf(p.ds)]+')</b><span>'+t(p.a)+'<br>'+t(p.b)+'</span></div><div class="v2r-a"><button type="button" onclick="v2OvClose();openD('+p.a.id+')">일정 보기</button><button type="button" onclick="v2OvlAck('+i+')">확인했어요</button></div></div>';
  }).join('');

}
// 창이 열린 사이 겹친 예약 목록이 바뀌면(다른 기기에서 새 겹침·확인) 창도 지금 목록으로

// ── 옛 판에서 못 올린 기록 구출(자동으로 넣지 않고 사람이 정한다) ──
function v2RescueRec(){try{const r=JSON.parse(localStorage.getItem(V2.rescueKey)||'null');return r&&typeof r==='object'?r:{h:'',done:{}};}catch(e){return{h:'',done:{}};}}

// (261107 운영-003 20 저장엔진 v2) 옛 캐시는 «처음 한 번»만 지금 클라우드와 비교한다. 그때 찾은 옛 일정(rec.old)만 남겨 두고, 같은 옛 캐시로 다시 열면

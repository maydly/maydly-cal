<!-- 관리자 전용 파일 - 일반 공개 금지 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>maydly — 명진 캘린더 v3.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#fefefe;--bg2:#f7f9f7;--sf:#fff;--sf2:#f5f8f5;--sf3:#eef3ee;
  --bd:#e2ebe2;--bd2:#cddccd;
  --tx:#2a3a2a;--mu:#7a9a7a;--mu2:#5a7a5a;
  --R:#7ab87a;--Rl:rgba(122,184,122,.1);--Rd:#5a9a5a;
  --ok:#6ab87a;--wait:#c8a456;--ng:#c86060;
  --r:8px;
}
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400&display=swap');
body{font-family:-apple-system,'Pretendard','Apple SD Gothic Neo',sans-serif;height:100vh;overflow:hidden;background:var(--bg);color:var(--tx)}

/* ── LANDING ── */
#landing{
  height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;background:var(--bg);position:relative;overflow:hidden;
}
.land-clover-wrap{position:absolute;inset:0;pointer-events:none;overflow:hidden}

/* ── APP ── */
#app{height:100vh;width:100vw;max-width:100vw;overflow-x:hidden;display:none;flex-direction:column;background:var(--bg)}
.topnav{overflow-x:auto;scrollbar-width:none}
.topnav::-webkit-scrollbar{display:none}
.topnav{
  display:flex;align-items:center;padding:0 20px;
  border-bottom:1px solid var(--bd);background:var(--sf);
  flex-shrink:0;height:50px;gap:0;
}
.tn-logo{
  font-family:'Noto Serif KR',Georgia,serif;font-weight:300;font-style:italic;
  font-size:18px;color:var(--mu2);margin-right:20px;letter-spacing:1px;flex-shrink:0;
}
.tn-tabs{display:flex;flex:1;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tn-tabs::-webkit-scrollbar{display:none}
.tn-tab{
  padding:0 14px;height:50px;line-height:50px;font-size:11px;font-weight:600;
  color:var(--mu);cursor:pointer;border-bottom:2px solid transparent;
  transition:all .15s;white-space:nowrap;letter-spacing:.3px;flex-shrink:0;
}
/* 폰 — 탭이 4개로 늘어 자리가 빠듯하므로, 상단 우측 표시를 줄여 탭 자리를 확보한다 */
@media(max-width:560px){
  .tn-tab{padding:0 9px;letter-spacing:0}
  .tn-mode{display:none!important}
  .autosave-ind{font-size:10px!important;padding:3px 7px!important}
  .tn-logo{display:none}
}
.tn-tab:hover{color:var(--tx)}
.tn-tab.on{color:var(--Rd);border-bottom-color:var(--R)}
.tn-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tn-back{
  background:none;border:1px solid var(--bd);color:var(--mu);
  padding:5px 12px;border-radius:20px;cursor:pointer;font-size:11px;
  transition:all .2s;
}
.tn-back:hover{border-color:var(--R);color:var(--Rd)}
.tn-mode{font-size:10px;color:var(--mu);opacity:.7}

.page{flex:1;overflow:hidden;display:none}
.page.on{display:flex;flex-direction:column}

/* ── CAL LAYOUT ── */
.cal-layout{display:flex;flex:1;overflow:hidden;position:relative}
.cal-sb{
  width:190px;flex-shrink:0;background:var(--sf);
  border-right:1px solid var(--bd);overflow-y:auto;padding:14px 0;
  transition:width .25s,opacity .25s;
}
.cal-sb.collapsed{width:0;overflow:hidden;padding:0;opacity:0}
.sb-toggle{
  position:absolute;left:0;top:50%;transform:translateY(-50%);
  z-index:10;width:18px;height:44px;
  background:var(--sf);border:1px solid var(--bd);border-left:none;
  border-radius:0 6px 6px 0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:var(--mu);font-size:10px;transition:left .25s,background .15s;
}
.sb-toggle:hover{background:var(--sf2);color:var(--Rd)}
.cal-body{flex:1;display:flex;flex-direction:column;overflow:hidden}
.cal-top{
  padding:10px 16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  border-bottom:1px solid var(--bd);background:var(--sf);flex-shrink:0;
}
/* 상단 라벨 필터바 (사이드바 대체, 웹·폰 공통) */
.cal-filterbar{display:flex;align-items:center;gap:6px;padding:7px 12px;border-bottom:1px solid var(--bd);background:var(--sf);flex-shrink:0}
.flt-chips{display:flex;gap:6px;flex:1;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:1px}
.flt-chip{display:flex;align-items:center;gap:5px;white-space:nowrap;border:1px solid var(--bd);background:var(--sf2);color:var(--mu);padding:4px 11px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;flex-shrink:0;transition:all .15s}
.flt-chip.on{background:#fff;color:var(--tx)}
.flt-chip:not(.on){opacity:.45}
.flt-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.flt-sync{flex-shrink:0;border:1px solid var(--bd);background:var(--sf2);color:var(--mu2);height:28px;padding:0 11px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:600;line-height:1;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.flt-sync:hover{border-color:var(--R);color:var(--Rd)}
.nb{
  background:var(--sf2);border:1px solid var(--bd);color:var(--tx);
  padding:4px 9px;border-radius:20px;cursor:pointer;font-size:11px;transition:border-color .15s;
}
.nb:hover{border-color:var(--R)}
.nb.ar{padding:4px 6px;font-size:12px;line-height:1}   /* 화살표 전용 — 연·월 이동 5개가 폰 한 줄에 들어가게 */
/* 좁은 폰(390px 등): 연 이동 버튼 2개가 늘어도 상단 줄이 한 줄로 유지되도록 여백만 줄인다 */
@media(max-width:440px){
  .cal-top{gap:5px;padding:10px 12px}
  .nb{padding:4px 7px}
  .nb.ar{padding:4px 5px}
  .vb{padding:4px 8px}
  .add-b{padding:6px 11px;margin-left:2px}
}
.ml{font-size:13px;font-weight:600;min-width:auto;color:var(--tx)}
.vt{display:flex;gap:2px;background:var(--sf2);border-radius:20px;padding:2px;margin-left:auto}
.vb{
  padding:4px 10px;border-radius:18px;border:none;background:none;
  color:var(--mu);cursor:pointer;font-size:11px;font-weight:600;transition:all .15s;
}
.vb.on{background:var(--R);color:#fff}
.add-b{
  border:none;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:600;
  cursor:pointer;background:var(--R);color:#fff;margin-left:4px;transition:background .15s;
}
.add-b:hover{background:var(--Rd)}

/* sidebar */
.mini-wrap{padding:12px}
.mini-hd{font-size:10px;color:var(--mu);font-weight:600;margin-bottom:7px;letter-spacing:.3px}
.mini-g{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.md{text-align:center;font-size:9px;padding:3px 1px;color:var(--mu);cursor:pointer;border-radius:2px}
.md.hd{font-weight:700;cursor:default}
.md.td{background:var(--R);color:#fff;border-radius:50%;font-weight:800}
.md.he{color:var(--tx);font-weight:600}
.sb-sect{font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:var(--mu);padding:10px 12px 5px;font-weight:700}
.sb-item{display:flex;align-items:center;gap:7px;padding:4px 12px;font-size:11px;cursor:pointer}
.sb-item input{width:12px;height:12px;cursor:pointer;accent-color:var(--R)}
.sb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sb-item span{color:var(--mu2);font-size:11px}
.legend{padding:10px 12px;border-top:1px solid var(--bd);margin-top:6px}
.leg-i{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--mu2);margin-bottom:5px}
.leg-d{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* MONTH */
.mg-wrap{padding:8px;display:flex;flex-direction:column;gap:4px;flex:1;overflow:hidden;min-height:0}
.mg-hdr.sticky-hdr{position:sticky;top:0;background:var(--bg);z-index:2;padding-top:2px}
.mg-hdr{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dl{text-align:center;font-size:12px;color:var(--mu);font-weight:700;padding:4px 0;letter-spacing:.5px}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:8px;overflow:hidden;flex:1;min-height:0}
.mc{background:var(--sf);padding:3px 2px;cursor:pointer;min-width:0;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:1px;scrollbar-width:none}
.mc::-webkit-scrollbar{width:0;display:none}
.m-bar>span{min-width:0}
.dn.sticky{position:sticky;top:-4px;background:var(--sf);z-index:1}
.mc:hover{background:var(--sf2)}
.mc.dim{opacity:.35;background:var(--bg2)}
.mc.tdc{background:var(--Rl)}
.dn{font-size:13px;color:var(--mu);font-weight:600;margin-bottom:2px;flex-shrink:0}
.tdc .dn{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:var(--R);color:#fff;font-size:8px;font-weight:800}
.m-bar{font-size:10.5px;padding:1px 4px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;margin-bottom:2px;cursor:pointer;flex-shrink:0;line-height:1.45}
/* 장기(다일) 일정 = 칸 여백 넘어 이어지는 연속 바 */
.m-span{margin-left:-3px;margin-right:-3px;border-radius:0;padding-left:6px}
.m-span.m-cont{padding-left:4px}
.m-bar-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.more-m{font-size:8px;color:var(--mu);padding:1px 4px}
.avail-slot{font-size:8px;padding:2px 5px;border-radius:10px;font-weight:600;margin-bottom:2px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}

/* TIME GRID */
.tg-wrap{flex:1;overflow:auto;padding:10px;position:relative}
.tg-inner{position:relative}
.tg-grid{display:grid;background:var(--bd);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.tg-corner{background:var(--sf2)}
.tg-dh{background:var(--sf2);padding:8px 5px;text-align:center}
.tg-dh .wd{font-size:9px;color:var(--mu);font-weight:700}
.tg-dh .wn{font-size:14px;font-weight:700}
.tg-dh.td .wn{background:var(--R);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;margin:0 auto}
.tg-tl{background:var(--sf);padding:3px 6px;font-size:9px;color:var(--mu);text-align:right;border-right:1px solid var(--bd);display:flex;align-items:flex-start;justify-content:flex-end;padding-top:4px}
.tg-cell{background:var(--sf);border-left:1px solid var(--bd);cursor:pointer}
.tg-cell:hover{background:var(--sf2)}
.t-block{position:absolute;border-radius:6px;padding:4px 7px;font-size:9px;font-weight:600;overflow:hidden;cursor:pointer;transition:filter .15s;z-index:1;color:#fff}
.t-block:hover{filter:brightness(.95)}
.tb-lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-time{font-size:8px;opacity:.8;margin-top:1px}

/* PANEL */
.ov{position:fixed;inset:0;background:rgba(30,40,30,.35);z-index:300;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.pn{background:var(--sf);border:1px solid var(--bd);border-radius:14px;width:min(440px,94vw);max-width:94vw;max-height:88vh;overflow-y:auto;overflow-x:hidden;padding:26px 18px;box-shadow:0 8px 40px rgba(0,0,0,.08)}
.pn .fg2>*,.pn .fg>div>input,.pn .fg>div>select{min-width:0}
.pn-h{font-size:14px;font-weight:600;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}
.px{background:none;border:none;color:var(--mu);font-size:20px;cursor:pointer;opacity:.6;transition:opacity .15s}
.px:hover{opacity:1}
.fg{margin-bottom:12px}
.fg label{font-size:9px;color:var(--mu);display:block;margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg select,.fg textarea{width:100%;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);padding:9px 11px;border-radius:var(--r);font-size:16px;outline:none;font-family:inherit}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--R);background:var(--sf)}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub-btn{width:100%;padding:11px;border:none;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;background:var(--R);color:#fff;margin-top:4px;transition:background .15s}
.sub-btn:hover{background:var(--Rd)}
.sub-btn:disabled{opacity:.5;cursor:not-allowed}
/* 일정 폼 저장 버튼 하단 고정 — 스크롤 없이 항상 보이게 */
.form-foot{position:sticky;bottom:-26px;z-index:5;background:var(--sf);margin:8px -18px -26px;padding:10px 18px 16px;box-shadow:0 -10px 14px -10px rgba(0,0,0,.12)}
.form-foot .sub-btn{margin-top:0}
@media(max-width:520px){.pn{max-height:92vh;padding:18px 14px}.fg{margin-bottom:9px}.form-foot{margin:8px -14px -18px;padding:10px 14px 14px;bottom:-18px}}
.label-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:4px}
.label-chip{border-radius:20px;padding:5px 6px;cursor:pointer;font-size:9px;font-weight:700;text-align:center;color:#fff;transition:opacity .15s;border:2px solid transparent;opacity:.6}
.label-chip:hover{opacity:.85}
.label-chip.sel{border-color:rgba(0,0,0,.25);opacity:1}
.badge{padding:2px 9px;border-radius:20px;font-size:9px;font-weight:700;display:inline-block}
.bOK{background:rgba(106,184,122,.15);color:var(--ok)}
.bWAIT{background:rgba(200,164,86,.15);color:var(--wait)}
.det-r{display:flex;gap:8px;font-size:12px;margin-bottom:9px;align-items:flex-start}
.det-l{color:var(--mu2);font-size:10px;min-width:60px;flex-shrink:0;margin-top:1px}
.act-row{display:flex;gap:8px;margin-top:14px}
.btn-ok{background:var(--ok);color:#fff;border:none;padding:8px 18px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer}
.btn-ng{background:transparent;color:var(--ng);border:1px solid var(--ng);padding:8px 18px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer}
.btn-del{width:100%;background:none;border:1px solid var(--bd);color:var(--ng);padding:7px;border-radius:20px;cursor:pointer;font-size:11px;margin-top:8px}
.client-view-box{margin-top:12px;padding:10px 12px;background:var(--sf2);border-radius:var(--r);border-left:2px solid var(--R)}
.cv-label{font-size:9px;color:var(--mu);font-weight:700;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.cv-val{font-size:11px;color:var(--Rd)}

/* REQ */
.rq-wrap{flex:1;overflow-y:auto;padding:18px}
.rcard{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:10px}
.rn{font-size:13px;font-weight:700}
.rm{font-size:10px;color:var(--mu2);margin-top:3px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:13px}
.sn{font-size:22px;font-weight:800;color:var(--R)}
.sl{font-size:10px;color:var(--mu2);margin-top:2px}
.sect-label{font-size:9px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}

/* IMPORT */
.import-wrap{flex:1;overflow-y:auto;padding:18px}
.import-box{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px}
.import-box h3{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--Rd)}
.import-box p{font-size:11px;color:var(--mu2);line-height:1.7;margin-bottom:12px}
.import-box textarea{width:100%;height:140px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);padding:10px;border-radius:var(--r);font-size:11px;font-family:monospace;outline:none;resize:vertical}
.import-box textarea:focus{border-color:var(--R)}
.import-result{margin-top:10px;font-size:11px;padding:8px 12px;border-radius:var(--r);display:none}
.import-result.ok{background:rgba(106,184,122,.12);color:var(--ok);display:block}
.import-result.err{background:rgba(200,96,96,.08);color:var(--ng);display:block}

/* STORAGE INFO */
.storage-bar{padding:10px 12px;border-top:1px solid var(--bd);margin-top:8px}
.storage-info{font-size:10px;color:var(--mu2);line-height:1.8}
.storage-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--R);margin-right:4px;vertical-align:middle}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--sf);border:1px solid var(--bd);color:var(--Rd);padding:10px 22px;border-radius:30px;font-size:11px;font-weight:700;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.toast.on{opacity:1}
option{background:#fff}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}

/* ADMIN LOGIN */
.login-wrap{display:flex;gap:8px;margin-bottom:12px}
.login-btn{flex:1;padding:11px;border:1px solid var(--bd);border-radius:var(--r);background:var(--sf2);cursor:pointer;font-size:11px;font-weight:600;color:var(--mu2);transition:all .2s;text-align:center}
.login-btn:hover,.login-btn.sel{border-color:var(--R);color:var(--Rd);background:var(--Rl)}

/* iCal fetch result */
#ical-fetch-result { margin-top:6px; font-size:12px; white-space:pre-wrap; }
/* ── 대시보드 (260912) ── */
#pg-dash{--dmint:#cfe9db;--dmint2:#a9dcc3;--dlime:#d8e85c;--dlime2:#eef3b8;--dgrn:#3f7a4a;
  --dredbg:#fdeceb;--dambbg:#fdf4e6;--dln:#eef2ed;overflow:auto;background:#f5f8f4}
.dwrap{display:grid;grid-template-columns:1fr 292px;gap:13px;padding:18px;max-width:1280px;margin:0 auto}
@media(max-width:900px){#pg-dash:not(.fit) .dwrap{grid-template-columns:1fr}}
.dmain{display:flex;flex-direction:column;gap:13px;min-width:0}
.drail{display:flex;flex-direction:column;gap:13px;min-width:0}
.dhd h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.ddate{font-size:12px;color:var(--mu);margin-top:2px}
.dcard{background:#fff;border-radius:18px;padding:15px 16px}
.dch{display:flex;align-items:center;margin-bottom:12px;gap:8px}
.dch h2{margin:0;font-size:14px;font-weight:800}
.dpill{margin-left:auto;background:var(--dlime2);color:#4a5a12;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px}
.dnote{font-size:10.5px;color:var(--mu);margin-top:10px;line-height:1.6}
.dempty{font-size:12px;color:var(--mu);text-align:center;padding:16px 0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
@media(max-width:700px){#pg-dash:not(.fit) .kpis{grid-template-columns:1fr 1fr}}
.kpi{background:#fff;border-radius:16px;padding:13px 14px}
.kpi.hl{background:var(--dmint)}
.kpi .t{display:flex;align-items:flex-start;gap:7px}
.kpi .lb{font-size:11px;color:var(--mu2);flex:1;font-weight:700}
.kpi .ic{width:27px;height:27px;border-radius:9px;background:#fff;display:grid;place-items:center;font-size:13px}
.kpi .v{font-size:25px;font-weight:800;margin:6px 0 7px;letter-spacing:-.02em}
.dtag{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtag.up{background:var(--dlime2);color:#6d7d16}
.dtag.dn{background:var(--dredbg);color:#c0483c}
.dtag.nt{background:#f1f4f0;color:var(--mu2)}
.dg2{display:grid;grid-template-columns:352px 1fr;gap:13px}
@media(max-width:760px){#pg-dash:not(.fit) .dg2{grid-template-columns:1fr}}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:322px}
.mini b{font-size:10px;color:var(--mu);text-align:center;font-weight:700}

<script>
// ── 유틸 (최상단 정의, UTC 버그 방지) ──
function fd(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return`${y}-${m}-${dd}`;}
function parseDS(ds){const[y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d);}
function dowOf(ds){return parseDS(ds).getDay();} // 0=일,1=월,...,6=토
function pad(n){return String(n).padStart(2,'0');}
function mkd(n){const d=new Date(TODAY);d.setDate(TODAY.getDate()+n);return fd(d);}
function addH(t,h){const[hh,mm]=t.split(':').map(Number);const tot=hh*60+mm+h*60;return`${pad(Math.floor(tot/60)%24)}:${pad(tot%60)}`;}
function addDays(ds,n){const d=new Date(ds);d.setDate(d.getDate()+n);return fd(d);}

// ── 상수 ──
const TODAY=new Date(), TSTR=fd(TODAY);
const STORAGE_KEY='maydly_events_v2';
const STORAGE_REQ_KEY='maydly_requests_v2';
const STORAGE_GCAL_KEY='maydly_gcal_admin_v1';

// ── GitHub 저장 (260716 v6.0) ──
// Netlify 서버 함수(/api/events) 대신, 관리자 화면이 GitHub API로 직접 저장한다.
//  · 원본(events.json, 고객명·연락처 포함) → 비공개 저장소
//  · 공개용(public.json, 개인정보 뺀 가용시간만) → 공개 저장소(고객 페이지가 읽음)
// 토큰은 소스에 넣지 않는다. 명진이 관리자 화면에 1회 입력 → 이 기기 localStorage에만 저장.
const GH_OWNER='maydly';
const GH_DATA  ={repo:'maydly-cal-data', path:'events.json'};  // 비공개 원본
const GH_PUBLIC={repo:'maydly-cal',      path:'public.json'};  // 공개 (고객이 읽음)
const GH_TOKEN_KEY='maydly_gh_token';
let _ghToken=localStorage.getItem(GH_TOKEN_KEY)||'';
const _ghSha={};   // 경로별 최신 sha 기억 (PUT 시 필요)

function ghHeaders(){return{Authorization:'Bearer '+_ghToken,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};}
// UTF-8 안전 base64 (한글 깨짐 방지)
function b64encode(str){return btoa(unescape(encodeURIComponent(str)));}
function b64decode(b64){return decodeURIComponent(escape(atob(b64.replace(/\n/g,''))));}

// ── 저장 계층: GitHub 토큰 → Firestore(구글 로그인)로 교체 ──
// GH_DATA(비공개 예약 전체) → Firestore 문서 mj_cal/events
// GH_PUBLIC(고객 공개 가용여부)   → Firestore 문서 cal_public/schedule
function fsPathFor(cfg){ return cfg===GH_PUBLIC ? 'cal_public/schedule' : 'mj_cal/events'; }
async function ghGet(cfg){
  const data=await window.MJCAL.get(fsPathFor(cfg));   // {events,savedAt} 또는 공개객체, 없으면 null
  return {data, sha:null};
}
async function ghPut(cfg,obj){
  await window.MJCAL.put(fsPathFor(cfg), obj);
}
function hasToken(){ return !!(window.MJCAL && window.MJCAL.user); }   // 로그인=연결
function saveGhToken(t){ /* 토큰 방식 폐지 — 구글 로그인 사용 */ }

// ── 구글 캘린더 설정 ──
const GCAL_MINJIN_KEYWORDS=['명진'];
const GCAL_CAL_IDS=[
  'dcba34499541fc3f1eed2a55fc82633f0bdc28ca369d81dda4785e7e830bdb45@group.calendar.google.com',
  '9fcd35edcb1b4b433445d0bb1e2d0c5cbb312ca9f87830d0e9b9b2321030b54e@group.calendar.google.com',
];

// gcalEvents: [{date:'2026-05-15', allDay:true}, ...]
let gcalEvents=[];
function loadGcalCache(){
  try{const raw=sessionStorage.getItem(STORAGE_GCAL_KEY);if(raw){const d=JSON.parse(raw);gcalEvents=d.events||[];}}catch(e){}
}
function saveGcalCache(events){

  try{sessionStorage.setItem(STORAGE_GCAL_KEY,JSON.stringify({events,at:Date.now()}));}catch(e){}
}
loadGcalCache();

function nowStr(){return new Date().toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}

// ── 라벨 (TimeTree 라벨 목록 기준) ──
const LABELS={
  studio_m:{name:'남스튜디오',color:'#4a9a6a'},
  studio_f:{name:'여스튜디오',color:'#e0608a'},
  outdoor:{name:'야외',color:'#4a8abf'},
  studio_pay:{name:'스튜디오페이',color:'#f5c400',tc:'#3a2f00'},   // (260904) 여스튜디오와 헷갈려 노랑으로 — 밝은 색이라 글자는 진하게
  outdoor_pay:{name:'야외페이',color:'#1a237e'},                    // (260904) 남스튜디오와 헷갈려 남색으로
  pa_shoot:{name:'PA촬영',color:'#7050c0'},
  rest:{name:'휴무',color:'#c03030'},

  brand:{name:'브랜드/상업',color:'#8a6040'},
  personal:{name:'개인',color:'#999'},
  suvin:{name:'수빈',color:'#e08a3c'},
};
// maydly 예약이 아닌 외부 캘린더 라벨(수빈).
// (260828) 공개데이터 계산에서는 더 이상 제외하지 않는다 — 수빈 일정이 있으면 고객 캘린더에서도 막힌다.
//          종일이면 그날 전체, 시간이 지정돼 있으면 그 시간만 (일반 일정과 동일 규칙).
//          단 전달기한·촬영 집계 등 maydly 촬영 전용 기능에서는 계속 제외한다(isExt 나머지 사용처).
// (260718) '휴일'(holiday) 라벨을 '휴무'(rest)로 통합. 로드 시 자동 변환 → 기존 휴일 예약도 휴무로 취급되고,
//          저장하면 실제로 rest로 바뀜. 선택지·필터엔 '휴무'만 남음. (국가공휴일 KR_HOLIDAYS와는 무관)
function mergeHoliday(evs){ if(Array.isArray(evs)) evs.forEach(function(e){ if(e&&e.label==='holiday') e.label='rest'; if(e&&e.label==='nopay'){ e.label='studio_f'; var _t='[과거이력1: 원 무페이]'; if((e.note||'').indexOf(_t)<0) e.note=(e.note?e.note+' ':'')+_t; } }); return evs; }
const EXT_LABELS=['suvin'];
function isExt(e){return e&&(e.ext||EXT_LABELS.includes(e.label));}
// 라벨색을 배경으로 쓸 때의 글자색. 밝은 라벨(노랑 등) 위에 흰 글씨를 쓰면 안 보인다.
function lblTc(k){return (LABELS[k]&&LABELS[k].tc)||'#fff';}

// ── 노쇼 → 재예약 연결 (260904) ──
// 준비 미흡으로 노쇼가 된 예약을, 새로 잡은 일정과 이어 둔다.
// 새 일정에만 reFrom(원 예약 id)을 남기고 원 예약 쪽은 거꾸로 찾아 표시한다.
// (양쪽에 저장하지 않으므로 한쪽만 지워져 어긋날 일이 없다)
// half=true → 반값으로 다시 받은 건.
let _reFrom=null;   // '재예약 만들기'로 연 추가 폼에서만 값이 들어간다
function evById(id){return maydlyEvents.find(x=>x.id===id)||null;}
function reBookOf(id){return maydlyEvents.filter(x=>x.reFrom===id).sort((a,b)=>String(a.date).localeCompare(String(b.date)));}
// ── status 정의 (260630 v4.0 개편): 예약→촬영→구매 흐름 6단계 ──
// active=true → 실제 예약(고객 공개 '예약불가'·집계에 포함), false → 노쇼/취소
const STATUS={
  none:      {name:'개인·휴무',    emoji:'',    active:true},   // (0) 예약이 아닌 일정(개인·휴무) — 상태 없음
  booked:    {name:'예약완료',     emoji:'🙋🏻', active:true},   // (1) 의상 공유 전 — 🙋🏻 표시
  outfit:    {name:'의상확인',     emoji:'',    active:true},   // (2) 의상확인 완료 — 🙋🏻 떼냄(표시 없음)
  nosh:      {name:'노쇼',         emoji:'🚫',  active:false},  // (3) 개인사정/규정 미준수
  buy_select:{name:'2번구매',      emoji:'▶️',  active:true},   // (4) 셀렉한 사진만 색보정 제공
  buy_raw:   {name:'원본구매',     emoji:'⏩',  active:true},   // (5) 원본 전체(보정X)
  buy_color: {name:'원본색보정구매',emoji:'⏭️', active:true},   // (6) 원본 전체+색보정
  // ── 구버전 데이터 호환 ──
  confirmed:{name:'예약완료',emoji:'🙋🏻',active:true},
  pending:  {name:'예약대기',emoji:'⏳',active:true},
  cancel:   {name:'취소',   emoji:'',  active:false},
};
const STATUS_ORDER=['none','booked','outfit','nosh','buy_select','buy_raw','buy_color'];
// 노쇼 표시 색(회색 통일) + 노쇼를 목록 맨 아래로 보내는 정렬
const NOSH_COLOR='#dcdcdc';   // 노쇼 배경(연한 회색)
const NOSH_TEXT='#8a8a8a';    // 노쇼 글씨(연한 배경 위 진회색 — 가독성)
function noshLast(a,b){
  // 정렬 하단 규칙: 내 일정(0) < PA촬영(1) < 노쇼(2)
  const _rk=e=>e.status==='nosh'?2:(e.label==='pa_shoot'?1:0);
  const ra=_rk(a), rb=_rk(b);
  if(ra!==rb)return ra-rb;
  return (a.time||'').localeCompare(b.time||'');
}
function stInfo(s){return STATUS[s]||STATUS.booked;}
function stName(s){return stInfo(s).name;}
function stEmoji(s){return stInfo(s).emoji||'';}
function stActive(s){return stInfo(s).active!==false;}
function stOptions(sel){return STATUS_ORDER.map(k=>`<option value="${k}"${k===sel?' selected':''}>${STATUS[k].emoji?STATUS[k].emoji+' ':''}${STATUS[k].name}</option>`).join('');}
// 고객명 앞 상태 이모지 표시 (+워터마크 제거 표시 이모지)
function nameTag(e,fallback){const c=e.client||fallback;const em=e.label==='pa_shoot'?'':stEmoji(e.status);const wm=e.wm?(e.wmEmoji||'💧'):'';const hf=e.half?' ½':'';return wm+(em?em:'')+c+hf;}   // ½는 이름 뒤 — 앞에 두면 좁은 칸에서 이름이 밀린다
// 시간(duration) 옵션 — 종일·다일 포함
const DUR_OPTS=[1,2,3,4,5,6,7,8,10,12,24,48,72];
function durLabel(v){return v>=24?(v/24)+'일'+(v===24?' (종일)':''):v+'시간';}
function durOptions(sel){
  let vals=DUR_OPTS.slice();
  if(sel&&!vals.includes(sel))vals.push(sel);
  vals.sort((a,b)=>a-b);
  return vals.map(v=>`<option value="${v}"${v===sel?' selected':''}>${durLabel(v)}</option>`).join('');
}

// ── 전달 기한·알림 (260714 v5.0) ──
// 전달 기한을 관리하는 촬영 라벨. PA·휴무·개인·휴일·수빈은 제외.
const DELIV_LABELS=['studio_m','studio_f','outdoor','studio_pay','outdoor_pay','brand'];
// 이 날짜 이전 촬영은 이미 전달한 것으로 보고 알림을 띄우지 않는다(과거 1,300여 건 보호).
const DELIV_SINCE='2026-07-14';
const ALERT_LEAD=3;   // 전달 기한 며칠 전부터 알릴지
const OUTFIT_LEAD=3;  // 의상확인 — 촬영 며칠 전부터 알릴지 (260904 명진: 2→3. 의상 사진은 촬영 5일 전까지 받는 기준)
const BASIC_DUE={m:1};                                              // 기본 보정본 = 촬영일 + 1달
const BUY_DUE={buy_select:{w:2},buy_raw:{w:2},buy_color:{m:1}};     // 구매분 전달 기한
const DLV_TITLE={basic:'기본 보정본',buy_select:'2번 색보정',buy_raw:'전체 원본',buy_color:'전체 색보정'};

function addDue(ds,due){
  const d=parseDS(ds);
  if(due.m){
    // 월말 보정 — 1/31 + 1달은 3/3이 아니라 2월 말일로
    const day=d.getDate();
    d.setDate(1);d.setMonth(d.getMonth()+due.m);
    const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    d.setDate(Math.min(day,last));
  }
  if(due.w)d.setDate(d.getDate()+due.w*7);
  return fd(d);
}
function dDiff(from,to){return Math.round((parseDS(to)-parseDS(from))/86400000);}
function dueText(n){return n<0?`${-n}일 지남`:n===0?'오늘까지':`${n}일 남음`;}
function isDelivTarget(e){
  return !!e&&!isExt(e)&&stActive(e.status)&&DELIV_LABELS.includes(e.label)&&e.date>=DELIV_SINCE;
}
function basicDue(e){return addDue(e.date,BASIC_DUE);}
function buyDue(e){return BUY_DUE[e.status]?addDue(e.date,BUY_DUE[e.status]):null;}

// 지금 챙겨야 할 일 — 의상확인(촬영 D-2) / 기본 보정본 전달 / 구매분 전달
function buildAlerts(){
  const today=TSTR,out=[];
  maydlyEvents.forEach(e=>{
    if(isExt(e)||!stActive(e.status))return;
    // 의상확인 — 촬영 라벨만, 아직 안 지난 촬영만 (오늘 ~ OUTFIT_LEAD일 뒤).
    // 지나간 촬영은 이제 와서 의상확인할 일이 없으므로 알리지 않는다(과거 데이터 보호).
    if(e.status==='booked'&&DELIV_LABELS.includes(e.label)){
      const left=dDiff(today,e.date);
      if(left>=0&&left<=OUTFIT_LEAD)out.push({kind:'outfit',e,due:e.date,left,urgent:true});
    }
    // 🚨 긴급 보정본 — 직접 기록한 기한. 기록 즉시 목록에 뜨고, 임박하면 '지금 챙길 일'로.
    if(e.dlvRush&&!e.dlvRushDone){
      const left=dDiff(today,e.dlvRush);
      out.push({kind:'rush',e,due:e.dlvRush,left,urgent:left<=ALERT_LEAD});
    }
    if(!isDelivTarget(e)||e.date>today)return;  // 촬영 전이면 전달 기한 없음
    // 전달 대기 건은 촬영 직후부터 기한까지 계속 목록에 남긴다(누락 방지). urgent = 기한 임박·지남.
    if(!e.dlvBasic){
      const due=basicDue(e),left=dDiff(today,due);
      out.push({kind:'basic',e,due,left,urgent:left<=ALERT_LEAD});
    }
    const bd=buyDue(e);
    if(bd&&!e.dlvBuy){
      const left=dDiff(today,bd);
      out.push({kind:'buy',e,due:bd,left,urgent:left<=ALERT_LEAD});
    }
  });
  return out.sort((a,b)=>a.left-b.left||a.due.localeCompare(b.due));
}
function alertCount(){return buildAlerts().filter(a=>a.urgent).length;}

// ── 수빈 '확인 필요' 가드 (260904) ──
// 수빈이 들어오면 캘린더보다 '확인 필요'(알림)를 먼저 보게 하고,
// 캘린더로 넘어가려 하면 지난 건·다가오는 건을 알려 처리를 재촉한다. 명진에게는 적용하지 않는다.
const SUBIN_EMAILS=['ara030820@gmail.com'];

//   수빈 = 보정본 전달(기본·구매분·긴급) — 기한 7일 안까지 재촉

// 사유가 남아야 같은 고객이 다시 예약할 때 받을지 판단할 수 있다.
// ── 촬영 금액 (260912 명진) ──
// 여·남 스튜디오만 단가 고정(8만원), 나머지는 건마다 달라 등록할 때 직접 적는다.
// 계산 우선순위: 일정에 적은 금액 > 고정 단가(½ 반값이면 절반) > 미입력(집계에서 제외)
// 기간별 고정 단가 — 단가는 시기에 따라 바뀐다.
// (260912 명진) 2026년부터 여·남 스튜디오 8만원 확정. 그 이전 연도는 금액 변동이 있어
// 값을 받기 전까지는 비워둔다. 비워두면 그 시기 촬영은 '금액 미입력'으로 집계에서 빠진다.
// 과거 단가를 알려주시면 아래에 구간을 추가하면 그 시점부터 소급 계산된다.
const PRICE_TABLE=[
  // {from:'2023-01-01',p:{studio_f:00000,studio_m:00000}},   ← 과거 단가 확인되면 추가
  {from:'2026-01-01',p:{studio_f:80000,studio_m:80000}}
];
function fixedPriceOf(label,ds){
  let hit=null;
  PRICE_TABLE.forEach(function(r){ if(String(ds)>=r.from) hit=r; });   // 날짜에 해당하는 마지막 구간
  return hit&&hit.p[label]!=null?hit.p[label]:null;
}
const NO_PRICE_LABELS=['rest','personal','suvin'];   // 금액 칸을 아예 안 보여줄 라벨
function evAmount(e){
  if(!e)return null;
  if(e.amount!=null&&e.amount!=='')return Number(e.amount);
  const p=fixedPriceOf(e.label,e.date);
  if(p==null)return null;
  return e.half?Math.round(p/2):p;
}

// 화면에 넣는 사용자 입력(고객명 등)은 그대로 innerHTML에 붙이지 않는다
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── 중복 시간 차단 (260714 v5.0) ──
// 종일 일정 중 '하루를 통째로 막는' 라벨 — 휴무·휴일. (종일 '촬영'은 시간을 모르므로 겹침 판정에서 뺀다)
const DAY_BLOCK_LABELS=['rest','holiday'];
function isDayBlock(e){return !!e&&!!e.allDay&&DAY_BLOCK_LABELS.includes(e.label);}
// 일정의 시작·끝(ms). 종일은 그날 00:00부터 일수만큼.
function evSpan(e){
  const st=e.allDay?'00:00':(e.time||'00:00');
  const hours=e.allDay?Math.max(1,Math.round((e.dur||24)/24))*24:(e.dur||1);
  const s=new Date(e.date+'T'+st).getTime();
  return{s,t:s+hours*3600000};
}
// 두 일정이 겹치는가.
// - 휴무·휴일 종일이 한쪽에 있으면 → 그날 전체를 막으므로 날짜만 겹치면 겹침
// - 그 외 종일(시간 미상 촬영)은 겹침 판정에서 제외
// - 둘 다 시간이 있으면 → 시간대 비교
function evOverlap(a,b){
  const sa=evSpan(a),sb=evSpan(b);
  if(isDayBlock(a)||isDayBlock(b))return sa.s<sb.t&&sb.s<sa.t;
  if(a.allDay||b.allDay)return false;
  return sa.s<sb.t&&sb.s<sa.t;
}
// cand와 겹치는 기존 일정. 노쇼·취소는 제외. 외부 캘린더(수빈)도 제외하되, 휴일 종일은 하루 차단으로 본다.
function findOverlaps(cand,excludeId){
  return maydlyEvents.filter(e=>{
    if(e.id===excludeId)return false;
    if(!stActive(e.status))return false;
    if(isExt(e)&&!isDayBlock(e))return false;
    return evOverlap(cand,e);
  }).sort((x,y)=>(x.date+(x.time||'')).localeCompare(y.date+(y.time||'')));
}
// 가져오기(텍스트·JSON·iCal)는 한 번에 여러 건을 넣으므로 저장을 막지 않는다.
// 대신 방금 넣은 것 중 기존 일정과 시간이 겹치는 게 몇 건인지 세어 알려준다.
function countImportConflicts(ids){
  const set=new Set(ids);
  return maydlyEvents.filter(e=>set.has(e.id)&&findOverlaps(e,e.id).length>0).length;
}
function conflictNote(ids){
  const n=countImportConflicts(ids);
  return n?` ⚠ 그중 ${n}건은 기존 일정과 시간이 겹칩니다 (캘린더에서 확인하세요)`:'';
}

// ── 종일 촬영 안내 (260714 v5.2) ──
// 종일 촬영은 시간을 몰라 겹침 판정을 못 한다. 막지는 않되, 그 날 종일 촬영이 있다는 사실만 알려준다.
function coversDay(e,ds){
  const days=Math.max(1,Math.round((e.dur||24)/24));
  return ds>=e.date&&ds<=addDays(e.date,days-1);
}
function allDayShoots(ds){
  return maydlyEvents.filter(e=>e.allDay&&!isDayBlock(e)&&!isExt(e)&&stActive(e.status)&&coversDay(e,ds));
}
// 일정 추가·편집 폼 위에 붙는 안내줄 (날짜를 바꾸면 다시 계산된다)
function refreshAllDayNote(){
  const pb=document.getElementById('pb');if(!pb)return;
  const old=document.getElementById('allDayNote');if(old)old.remove();
  const sd=document.getElementById('f_sd');if(!sd||!sd.value)return;
  const list=allDayShoots(sd.value).filter(e=>e.id!==_editingId);
  if(!list.length)return;
  const names=list.map(e=>{
    const L=LABELS[e.label]||{name:'기타'};
    return esc(e.client||L.name)+` <span style="color:var(--mu)">(${L.name})</span>`;
  }).join(', ');
  const html=`<div id="allDayNote" style="border:1px solid #cfe0c9;background:#f2f7f0;border-radius:10px;padding:9px 11px;margin-bottom:12px">

// ── 공개용 가용시간 계산 (개인정보는 여기서 전부 버려짐 — 숫자만 남긴다) ──
// 저장 시 이 결과를 public.json으로 커밋하고, 고객 페이지가 그걸 읽는다.

// 반복 일정의 다음 발생일 계산 (260717)
function nextOccurrence(cur, repeat, origin){
  const d=new Date(cur);
  if(repeat==='daily'){d.setDate(d.getDate()+1);}
  else if(repeat==='weekly'){d.setDate(d.getDate()+7);}
  else if(repeat==='weekday'){do{d.setDate(d.getDate()+1);}while(d.getDay()===0||d.getDay()===6);}
  else if(repeat==='monthly_date'){d.setMonth(d.getMonth()+1);}
  else if(repeat==='monthly_nth'){
    const nth=Math.ceil(origin.getDate()/7),dow=origin.getDay();
    d.setMonth(d.getMonth()+1);d.setDate(1);
    while(d.getDay()!==dow)d.setDate(d.getDate()+1);
    d.setDate(d.getDate()+(nth-1)*7);
  }
  else if(repeat==='biweekly'){d.setDate(d.getDate()+14);}
  else if(repeat==='4weekly'){d.setDate(d.getDate()+28);}
  else if(repeat==='yearly'){d.setFullYear(d.getFullYear()+1);}
  else return null;
  return d;
}

function buildPublicSchedule(){
  const WIN_END=addDays(TSTR,185);  // 반복 일정 전개 창 — 공개 데이터 6개월치에 맞춰 확장(260724)
  const busyMap={};
  const mark=ds=>{if(!busyMap[ds])busyMap[ds]={allDay:false,slots:[]};return busyMap[ds];};
  maydlyEvents.forEach(e=>{
    // (260828) 수빈 라벨만 새로 포함한다. 예전에는 isExt(e)로 건너뛰어 수빈 일정이 고객 캘린더에 반영되지 않았다.
    //          제외 해제를 통째로 하지 않고 '수빈만' 콕 집는다 — isExt가 잡던 다른 것(외부 캘린더 ext 표시)은
    //          예전 그대로 제외해, 의도치 않은 날짜가 함께 막히지 않게 한다.
    if(!stActive(e.status))return;
    if(isExt(e)&&e.label!=='suvin')return;
    // 반복 일정 전개: 원본 날짜 + 90일 창 내 모든 발생일 (260717)
    const dates=[e.date];
    if(e.repeat&&e.repeat!=='none'){
      const origin=new Date(e.date+'T00:00:00');
      let cur=new Date(origin);
      for(let g=0;g<500;g++){
        const next=nextOccurrence(cur,e.repeat,origin);
        if(!next)break;
        const ds=fd(next);
        if(ds>WIN_END)break;
        dates.push(ds);
        cur=next;
      }
    }
    dates.forEach(ds=>{
      const fullDay=e.allDay||(['rest','outdoor_c','pa_shoot'].includes(e.label)&&(e.dur||0)>=8);
      if(fullDay){
        // 여러 날에 걸친 종일/휴무 일정은 시작일부터 끝나는 날까지 전부 마감
        const days=Math.max(1,Math.round((e.dur||24)/24));
        for(let k=0;k<days;k++)mark(addDays(ds,k)).allDay=true;
      }else if(e.time){
        const[hh,mm]=e.time.split(':').map(Number);
        const s=hh+mm/60,end=s+(e.dur||2);
        // 자정 넘는 일정: 당일·익일 분할 기록 (260717)
        if(end>24){
          mark(ds).slots.push({s,e:24});
          mark(addDays(ds,1)).slots.push({s:0,e:end-24});
        }else{
          mark(ds).slots.push({s,e:end});
        }
      }
    });
  });
  const schedule={};
  const LEAD_DAYS=7;   // 오늘부터 7일 이내(오늘~6일 뒤)는 자리가 남아도 예약 마감 — 7일 뒤부터 예약 가능
  // (260903) 리드타임 예외 — 여기 적은 날짜만 7일 이내여도 공개 데이터에 담는다.
  // 자리가 남아 급히 채우고 싶은 날에 쓴다. 날짜가 지나면 자동으로 무시되므로 지우지 않아도 된다.
  // 고객 화면에 실제로 띄울지는 index.html이 따로 판단한다(다 차면 감춤).

  // (260903) 공휴일 전날 마감 예외 — 여기 적은 날짜는 '다음날이 공휴일이면 20시 이후 마감' 규칙을
  // 적용하지 않는다. 즉 막타임(20~22시)까지 연다. 협업·페이 캘린더 양쪽에 함께 적용된다.

  for(let i=-7;i<185;i++){
    const d=new Date(TODAY);d.setDate(TODAY.getDate()+i);const ds=fd(d);const dow=dowOf(ds);
    // 지난 날 + 일주일 이내는 공개 데이터에서 아예 제외 → 고객 달력에 표시되지 않음(빈 칸)
    // (스튜디오·야외 공통. 노쇼 등으로 자리가 비어도 이 기간은 열지 않는다)
    if(i<LEAD_DAYS&&!(i>=0&&LEAD_EXCEPT.includes(ds))){continue;}
    if([1,2,5,6].includes(dow)){
      // 고정 차단 요일(월화금토): 실제 종일 일정이 있는 날만 예약 불가,
      // 그 외에는 야외촬영 문의 가능으로 공개 (야외촬영은 일정·시간 협의 가능)
      const fb=busyMap[ds];
      if(fb&&fb.allDay){schedule[ds]={unavailable:true};continue;}
      schedule[ds]={unavailable:true,outdoorInquiry:true};continue;
    }
    const busy=busyMap[ds];
    if(busy&&busy.allDay){schedule[ds]={unavailable:true};continue;}
    const bSlots=(busy&&busy.slots)||[];
    const overlap=(s,e)=>bSlots.some(r=>!(e<=r.s||s>=r.e));
    const timeSlots=dow===0?[[11,13],[14,16],[17,19],[20,22]]:[[14,16],[17,19],[20,22]];
    // 다음날이 국가공휴일이면 19시까지만 촬영 (20~22 타임 마감). 단 PREHOL_EXCEPT 날짜는 예외.
    const preHol=isPreHoliday(ds)&&!PREHOL_EXCEPT.includes(ds);
    schedule[ds]={
      slots:timeSlots.map(([s,e])=>({s:`${pad(s)}:00`,e:`${pad(e)}:00`,avail:!overlap(s,e)&&!(preHol&&s>=19)})),
      // 페이용 1시간 단위 캘린더 계산용 — 예약된 시간 범위(숫자만, 개인정보 없음)
      busy:bSlots.map(r=>[r.s,r.e]),
      ...(preHol?{preHol:true}:{})
    };
  }
  return{generated:new Date().toISOString(),note:'고객 공개용 — 예약 가능 여부만 포함',schedule};
}

let _pushT=null, _serverOn=false, _pushing=false;
function setSaveStatus(txt, state){
  const el=document.getElementById('gcalStatus');if(el)el.textContent=txt;
  const ind=document.querySelector('.autosave-ind');if(!ind)return;
  ind.textContent=txt;
  const S={ok:{bg:'#e6f4ea',color:'#1a7f37',bd:'#a8d5b5'},fail:{bg:'#fdecea',color:'#c62828',bd:'#f5a0a0'},loading:{bg:'#e8f0fe',color:'#1a73e8',bd:'#a8c4f5'},off:{bg:'#f5f5f5',color:'#888',bd:'#ddd'}};
  const s=S[state]||S.off;
  ind.style.background=s.bg;ind.style.color=s.color;ind.style.borderColor=s.bd;
}
function pushToGithub(){
  if(!hasToken())return;   // 토큰 없으면 로컬 단독 (저장은 localStorage에 이미 됨)
  clearTimeout(_pushT);
  _pushT=setTimeout(async()=>{
    if(_pushing)return; _pushing=true; setSaveStatus('⟳ 저장 중…','loading');
    try{
      await ghPut(GH_DATA,{events:maydlyEvents.filter(e=>!(e.id>=90000)),savedAt:new Date().toISOString()});
      await ghPut(GH_PUBLIC,buildPublicSchedule());   // 고객 공개 데이터도 함께 갱신
      _serverOn=true; lastSaved=nowStr(); setSaveStatus('✓ 저장됨 '+lastSaved,'ok');
    }catch(e){
      setSaveStatus('✗ 저장 실패','fail');
      toast('저장 실패: '+e.message);
    }finally{_pushing=false;}
  },500);
}
async function syncFromGithub(){
  if(!hasToken()){promptToken();return;}
  try{
    const {data}=await ghGet(GH_DATA);
    if(data&&Array.isArray(data.events)){
      _serverOn=true;
      maydlyEvents=mergeHoliday(data.events.filter(e=>!(e.id>=90000)));
      nextId=Math.max(0,...maydlyEvents.filter(e=>e.id<90000).map(e=>e.id||0),0)+1;
      try{localStorage.setItem(STORAGE_KEY,JSON.stringify(maydlyEvents));}catch(e){}
      if(typeof curPage!=='undefined'&&curPage==='cal')renderBody();
      if(typeof buildNav==='function')buildNav();
      const _synced=data.savedAt?new Date(data.savedAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):nowStr(); setSaveStatus('✓ 동기화 '+_synced,'ok');
      toast('최신 불러옴 ('+maydlyEvents.length+')');
    }else{
      // 저장소가 비었으면 현재(임베드) 데이터로 시드
      pushToGithub();
    }
  }catch(e){
    setSaveStatus('✗ 불러오기 실패','fail');
    toast('불러오기 실패: '+e.message);
  }
}

// 비밀번호 해시 (SHA-256). 평문 비밀번호는 코드에 없음.
// 아래 해시값은 '0898' 의 SHA-256 결과입니다.
// 비밀번호 변경 시: https://emn178.github.io/online-tools/sha256.html 에서 새 해시 생성 후 교체
const PW_HASH='9923e00231428d5272881c78ed1ffe7340dd73f4792d45ad24b5ab469fcc1a4b';
// 순수 JS SHA-256 (폰 http 등 crypto.subtle 없는 환경 대체)
function _sha256(ascii){
  function R(v,a){return (v>>>a)|(v<<(32-a));}
  var mp=Math.pow,mw=mp(2,32),i,j,result='';
  var words=[],abl=ascii.length*8;
  var hash=_sha256.h=_sha256.h||[],k=_sha256.k=_sha256.k||[],pc=k.length,ic={};
  for(var c=2;pc<64;c++){ if(!ic[c]){ for(i=0;i<313;i+=c)ic[i]=c; hash[pc]=(mp(c,.5)*mw)|0; k[pc++]=(mp(c,1/3)*mw)|0; } }
  ascii+='\x80'; while(ascii.length%64-56)ascii+='\x00';
  for(i=0;i<ascii.length;i++){ j=ascii.charCodeAt(i); if(j>>8)return; words[i>>2]|=j<<((3-i)%4)*8; }
  words[words.length]=((abl/mw)|0); words[words.length]=(abl);
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16),oh=hash; hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
      var t1=hash[7]+(R(e,6)^R(e,11)^R(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=i<16?w[i]:(w[i-16]+(R(w15,7)^R(w15,18)^(w15>>>3))+w[i-7]+(R(w2,17)^R(w2,19)^(w2>>>10)))|0);
      var t2=(R(a,2)^R(a,13)^R(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash); hash[4]=(hash[4]+t1)|0;
    }
    for(i=0;i<8;i++)hash[i]=(hash[i]+oh[i])|0;
  }
  for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16);}
  return result;
}
async function hashPw(pw){
  if(window.crypto&&crypto.subtle){
    try{
      const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }catch(e){}
  }
  return _sha256(pw); // 폰(http) 등 비-secure 컨텍스트 대체
}

async function syncGcal(){
  try{
    const today=new Date();
    const start=new Date(today.getFullYear(),today.getMonth()-1,1).toISOString();
    const end=new Date(today.getFullYear(),today.getMonth()+3,1).toISOString();

    if(!window.cowork||!window.cowork.callMcpTool)return;

    const results=await Promise.all(GCAL_CAL_IDS.map(calendarId=>
      window.cowork.callMcpTool(
        'mcp__0353f32c-2f0c-48a3-9788-097afa406bc9__list_events',
        {calendarId,startTime:start,endTime:end,pageSize:200}
      )
    ));
    const events=results.flatMap(r=>(r&&r.events)||[]);
    const parsed=[];
    events.forEach(ev=>{
      const sum=ev.summary||'';
      if(!GCAL_MINJIN_KEYWORDS.some(k=>sum.includes(k)))return;
      if(ev.start&&ev.start.date){
        parsed.push({allDay:true,date:ev.start.date});
      }else if(ev.start&&ev.start.dateTime){
        const d=ev.start.dateTime.slice(0,10);
        const st=ev.start.dateTime.slice(11,16);
        const et=ev.end.dateTime.slice(11,16);
        parsed.push({allDay:false,date:d,time:st,endTime:et});
      }
    });
    saveGcalCache(parsed);
    if(curPage==='cal')renderBody();
  }catch(e){console.log('gcal sync skip',e);}
}

(function(){
  const el=document.getElementById('pg-cal');if(!el)return;
  let x0=null,y0=null,t0=0;
  el.addEventListener('touchstart',e=>{
    if(e.touches.length!==1){x0=null;return;}
    if(e.target.closest&&e.target.closest('.cal-filterbar')){x0=null;return;} // 필터칩 가로스크롤은 제외
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now();
  },{passive:true});
  el.addEventListener('touchend',e=>{
    if(x0===null)return;
    const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0,dt=Date.now()-t0;
    if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4&&dt<600){
      if(dx<0)chM(1);else chM(-1); // 왼쪽으로 밀기→다음달, 오른쪽으로 밀기→이전달
    }
    x0=null;y0=null;
  },{passive:true});
  // 맥 트랙패드·마우스 가로 스크롤로도 월(주/일) 넘기기 (데스크탑)
  let wAcc=0,wLock=0;
  el.addEventListener('wheel',e=>{
    if(Math.abs(e.deltaX)<=Math.abs(e.deltaY)*1.2)return;   // 세로 스크롤은 그대로 둠
    e.preventDefault();                                      // 브라우저 뒤로가기 제스처 방지
    const now=Date.now();
    if(now-wLock<500){return;}                               // 한 번 넘긴 직후 연속 발동 방지
    wAcc+=e.deltaX;
    if(Math.abs(wAcc)>=60){
      chM(wAcc>0?1:-1);                                      // 왼쪽으로 밀기→다음, 오른쪽→이전
      wAcc=0;wLock=now;
    }
  },{passive:false});
})();

// 대시보드 (260912) — 읽기 전용. 기존 일정 데이터를 모아 보여주기만 한다.
// ══════════════════════════════════════════════════════════════
const DASH_SHOOT=['studio_m','studio_f','outdoor','studio_pay','outdoor_pay','brand'];
function isShootEv(e){return !!e&&DASH_SHOOT.includes(e.label)&&stActive(e.status);}
function mkOf(ds){return String(ds).slice(0,7);}
function addMk(mk,n){const a=mk.split('-').map(Number);const d=new Date(a[0],a[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function mkLabel(mk){return Number(mk.slice(5))+'월';}
function manwon(v){return v>=10000?Math.round(v/10000).toLocaleString('ko-KR')+'만':v.toLocaleString('ko-KR');}

// 하루의 슬롯 상태 (관리자 기준 — 고객용 리드타임은 적용하지 않는다)
function daySlots(ds){
  const dow=dowOf(ds);
  if([1,2,5,6].includes(dow))return{kind:'inq'};      // 월화금토 = 스튜디오 안 함
  const busy=[];let blocked=false;
  maydlyEvents.forEach(e=>{
    if(!stActive(e.status))return;
    if(e.ext&&e.label!=='suvin')return;
    const days=Math.max(1,Math.round((e.dur||24)/24));
    for(let k=0;k<days;k++){
      if(addDays(e.date,k)!==ds)continue;
      const fullDay=e.allDay||(['rest','outdoor_c','pa_shoot'].includes(e.label)&&(e.dur||0)>=8);
      if(fullDay){blocked=true;return;}
      if(e.time){const t=e.time.split(':').map(Number);const st=t[0]+(t[1]||0)/60;busy.push([st,st+(e.dur||2)]);}
    }
  });
  if(blocked)return{kind:'off'};
  const ts=dow===0?[[11,13],[14,16],[17,19],[20,22]]:[[14,16],[17,19],[20,22]];
  const preHol=isPreHoliday(ds)&&!PREHOL_EXCEPT.includes(ds);
  return{kind:'slots',slots:ts.map(function(r){
    const s=r[0],e=r[1];
    return{s:s,e:e,avail:!busy.some(function(b){return !(e<=b[0]||s>=b[1]);})&&!(preHol&&s>=19)};
  })};
}

function dashData(){
  const today=TSTR, thisMk=mkOf(today), day=Number(today.slice(8));
  const sun=new Date(TODAY); sun.setDate(TODAY.getDate()-TODAY.getDay());
  const wkFrom=fd(sun), wkTo=addDays(wkFrom,6);
  const D={};
  D.todayEvs=maydlyEvents.filter(function(e){return isShootEv(e)&&e.date===today;})
    .sort(function(a,b){return String(a.time||'').localeCompare(String(b.time||''));});
  D.weekEvs=maydlyEvents.filter(function(e){return isShootEv(e)&&e.date>=wkFrom&&e.date<=wkTo;});
  // 월별 집계
  D.byMonth={};
  maydlyEvents.forEach(function(e){
    if(!isShootEv(e))return;
    const mk=mkOf(e.date);if(!mk)return;
    const b=D.byMonth[mk]||(D.byMonth[mk]={n:0,sum:0,noAmt:0,noAmtEvs:[],upto:{}});
    b.n++;const a=evAmount(e);
    if(a==null){b.noAmt++;if(b.noAmtEvs.length<6)b.noAmtEvs.push(e);}else b.sum+=a;
    const dd=Number(e.date.slice(8));(b.upto[dd]=(b.upto[dd]||0)+1);
  });
  D.mk=thisMk; D.day=day;
  // 알림
  const al=buildAlerts();
  D.late=al.filter(function(a){return a.left<0;});
  D.alerts=al.slice().sort(function(a,b){return a.left-b.left;});
  // 노쇼
  const nosh=maydlyEvents.filter(function(e){return e.status==='nosh';});
  D.noshAll=nosh.sort(function(a,b){return String(b.date).localeCompare(String(a.date));});
  const yr=String(TODAY.getFullYear());
  D.yrDone=maydlyEvents.filter(function(e){return isShootEv(e)&&String(e.date).slice(0,4)===yr&&e.date<=today;}).length;
  D.yrPlan=maydlyEvents.filter(function(e){return isShootEv(e)&&String(e.date).slice(0,4)===yr&&e.date>today;}).length;
  D.yrNosh=nosh.filter(function(e){return String(e.date).slice(0,4)===yr;}).length;
  D.reason={};
  nosh.forEach(function(e){
    const r=(e.noshReason||'').split(' — ')[0]||'(사유 없음)';
    D.reason[r]=(D.reason[r]||0)+1;
  });
  D.reLinked=nosh.filter(function(e){return reBookOf(e.id).length>0;}).length;
  D.noshSoon=nosh.filter(function(e){
    return maydlyEvents.some(function(x){return isShootEv(x)&&x.date>today&&x.client&&e.client&&x.client===e.client;});
  });
  // 빈 자리 (앞으로 한 달)
  D.free=[];
  for(let i=0;i<31;i++){
    const ds=addDays(today,i), info=daySlots(ds);
    if(info.kind!=='slots')continue;
    const open=info.slots.filter(function(x){return x.avail;});
    if(open.length)D.free.push({ds:ds,times:open.map(function(x){return x.s;})});
  }
  D.freeCnt=D.free.reduce(function(a,b){return a+b.times.length;},0);
  // 한 달 슬롯 비중
  let cFull=0,cFree=0,cInq=0,cOff=0;
  for(let i=0;i<31;i++){
    const info=daySlots(addDays(today,i));
    if(info.kind==='inq'){cInq++;continue;}
    if(info.kind==='off'){cOff++;continue;}
    info.slots.forEach(function(x){x.avail?cFree++:cFull++;});
  }
  D.prop={full:cFull,free:cFree,inq:cInq,off:cOff};
  // 다가오는 2주
  D.two=[];
  for(let i=0;i<14;i++){
    const ds=addDays(today,i),info=daySlots(ds);
    let cls='off',n=0;
    if(info.kind==='inq')cls='inq';
    else if(info.kind==='off')cls='off';
    else{n=info.slots.filter(function(x){return x.avail;}).length;cls=n?'free':'full';}
    D.two.push({ds:ds,cls:cls,n:n});
  }
  return D;
}

function applyDashFit(){
  const pg=document.getElementById('pg-dash');if(!pg)return;
  const w=pg.querySelector('.dwrap');if(!w)return;
  let sp=pg.querySelector('.fitspacer');
  const on=dashFit&&pg.clientWidth<=760;
  pg.classList.toggle('fit',on);
  if(!on){
    w.style.width='';w.style.transform='';
    if(sp)sp.remove();
    return;
  }
  w.style.width='1280px';
  w.style.transform='none';
  const h=w.scrollHeight;                       // 축소 전 자연 높이
  // 기준 폭은 '실제 보이는 화면 폭'이어야 한다. 부모가 콘텐츠 때문에 넓어져 있을 수 있으므로
  // 뷰포트 폭과 함께 비교해 더 작은 값을 쓴다.
  const vw=Math.min(pg.clientWidth||99999, window.innerWidth||99999,
                    document.documentElement.clientWidth||99999);
  const s=vw/1280;
  w.style.transform='scale('+s+')';
  if(!sp){sp=document.createElement('div');sp.className='fitspacer';pg.appendChild(sp);}
  sp.style.height=Math.ceil(h*s)+'px';          // 스크롤 높이 확보
}

// 옛 시트(모델 정리·스케줄)에 있던 인스타 아이디와 노쇼/취소 이력을, 이미 등록된 일정에 채운다.
// 새 일정을 만들지 않고 기존 건만 고친다. id가 어긋났을 때를 대비해 날짜까지 대조한 뒤 적용한다.
const BACKFILL_KEYS=['insta','status','noshReason','note','amount','half','date'];   // date = 잘못 저장된 날짜 교정용
function backfillParse(){
  const el=document.getElementById('backfill-json');
  const raw=(el&&el.value||'').trim();
  if(!raw)throw new Error('붙여넣은 내용이 없습니다.');
  const arr=JSON.parse(raw);
  if(!Array.isArray(arr))throw new Error('배열 형식이어야 합니다.');
  return arr;
}
// 이름 정규화 — '님' 접미사·공백·괄호 제거 후 비교한다
function bfName(s){return String(s==null?'':s).replace(/\s+/g,'').replace(/\(.*?\)/g,'').replace(/(님)+$/,'');}
// 날짜+고객명으로 일정을 찾는다. 후보가 2건 이상이면 고르지 않고 돌려보낸다.
function bfFind(date,client){
  const key=bfName(client);
  const hit=maydlyEvents.filter(function(e){return e.date===date&&bfName(e.client)===key;});
  if(hit.length===1)return{e:hit[0]};
  if(hit.length===0)return{err:'그 날짜에 같은 이름의 일정이 없음'};
  return{err:'같은 날 같은 이름이 '+hit.length+'건 — 어느 건지 알 수 없음'};
}
function backfillPlan(arr){
  const ok=[],skip=[];
  arr.forEach(function(it){
    if(!it)return;
    let e=null;
    if(it.client){                       // 날짜+이름 방식 (권장)
      const r=bfFind(it.date,it.client);
      if(r.err){skip.push({it:it,why:r.err});return;}
      e=r.e;
    }else{                               // 예전 방식 — 번호로 찾되 날짜까지 맞아야 함
      e=evById(it.id);
      if(!e){skip.push({it:it,why:'그 번호의 일정이 없음'});return;}
      if(it.date&&e.date!==it.date){skip.push({it:it,why:'날짜가 다름 (캘린더 '+e.date+')'});return;}
    }
    const set=it.set||{};
    const ch=[];
    BACKFILL_KEYS.forEach(function(k){
      if(set[k]===undefined)return;
      const cur=e[k];
      if(k==='insta'&&cur&&String(cur).trim()){ch.push({k:k,from:cur,to:set[k],keep:true});return;}  // 이미 있으면 덮지 않음
      if(String(cur==null?'':cur)===String(set[k]))return;
      ch.push({k:k,from:cur,to:set[k]});
    });
    if(!ch.length){skip.push({it:it,why:'바뀔 내용 없음'});return;}
    // 날짜를 옮기는 경우 — 옮길 날짜에 같은 이름이 이미 있으면 중복이 되므로 막는다
    const dch=ch.filter(function(c){return c.k==='date';})[0];
    if(dch){
      const key=bfName(e.client);
      const dupe=maydlyEvents.filter(function(x){return x!==e&&x.date===dch.to&&bfName(x.client)===key;});
      if(dupe.length){skip.push({it:it,why:'옮길 날짜('+dch.to+')에 같은 이름이 이미 있음'});return;}
    }
    ok.push({e:e,ch:ch});
  });
  return{ok:ok,skip:skip};
}
function backfillPreview(){
  const res=document.getElementById('backfill-result');
  try{
    const plan=backfillPlan(backfillParse());
    const applyN=plan.ok.reduce(function(a,p){return a+p.ch.filter(function(c){return !c.keep;}).length;},0);
    const keepN=plan.ok.reduce(function(a,p){return a+p.ch.filter(function(c){return c.keep;}).length;},0);
    let h='<b>바꿀 일정 '+plan.ok.length+'건 · 변경 항목 '+applyN+'개</b>';
    if(keepN)h+=' <span style="color:var(--mu)">(이미 값이 있어 건너뜀 '+keepN+'개)</span>';
    if(plan.skip.length)h+='<br><span style="color:#c4763a">적용 안 됨 '+plan.skip.length+'건</span>';
    h+='<div style="max-height:220px;overflow:auto;margin-top:8px;text-align:left">';
    plan.ok.slice(0,25).forEach(function(p){
      h+='<div style="padding:5px 0;border-bottom:1px solid var(--bd);font-size:11.5px">'
        +'<b>'+p.e.date+' '+esc(p.e.client||'(이름 없음)')+'</b> — '
        +p.ch.map(function(c){return c.keep?('<span style="color:var(--mu)">'+c.k+' 유지</span>')
          :(c.k==='date'
             ?('<span style="color:#c4763a;font-weight:700">📅 날짜 '+esc(String(c.from))+' → '+esc(String(c.to))+'</span>')
             :(c.k+' <span style="color:var(--mu)">'+esc(String(c.from==null?'(없음)':c.from)).slice(0,18)+'</span> → <b>'+esc(String(c.to)).slice(0,24)+'</b>'));}).join(' · ')
        +'</div>';
    });
    if(plan.ok.length>25)h+='<div style="font-size:11px;color:var(--mu);padding-top:6px">… 외 '+(plan.ok.length-25)+'건</div>';
    plan.skip.slice(0,10).forEach(function(s){
      const tag=s.it&&(s.it.client?(s.it.date+' '+s.it.client):('id '+s.it.id));
      h+='<div style="padding:4px 0;font-size:11px;color:#c4763a">건너뜀 — '+esc(String(tag))+' · '+s.why+'</div>';
    });
    h+='</div>';
    res.className='import-result ok';res.innerHTML=h;
  }catch(err){res.className='import-result err';res.textContent='읽기 실패: '+err.message;}
}
function backfillApply(){
  const res=document.getElementById('backfill-result');
  try{
    const plan=backfillPlan(backfillParse());
    if(!plan.ok.length){res.className='import-result err';res.textContent='바꿀 내용이 없습니다.';return;}
    const moveN=plan.ok.filter(function(p){return p.ch.some(function(c){return c.k==='date';});}).length;
    const msg='일정 '+plan.ok.length+'건을 고칩니다.'+(moveN?'\n\n\u26a0\ufe0f 그중 '+moveN+'건은 날짜가 옮겨집니다.':'')
      +'\n\n되돌리기용 스냅샷을 먼저 저장합니다. 진행할까요?';
    if(!confirm(msg))return;
    pushUndoSnapshot();
    let n=0;
    plan.ok.forEach(function(p){
      p.ch.forEach(function(c){
        if(c.keep)return;
        p.e[c.k]=c.to;n++;
      });
      if(p.e.status==='nosh'&&!p.e.noshAt)p.e.noshAt=p.e.date;
    });
    saveEvents();
    if(curPage==='cal')renderBody();
    buildNav();
    res.className='import-result ok';
    res.innerHTML='✓ 일정 '+plan.ok.length+'건 · 항목 '+n+'개를 채웠습니다. 잘못됐으면 위의 「가져오기 되돌리기」로 복구하세요.';
    toast('과거 자료 채우기 완료');
  }catch(err){res.className='import-result err';res.textContent='적용 실패: '+err.message;}
}

function chM(n){
  if(calView==='day'){curDate.setDate(curDate.getDate()+n);}
  else if(calView==='week'){curDate.setDate(curDate.getDate()+n*7);}
  else{curDate.setMonth(curDate.getMonth()+n);}
  updLabel();renderMini();renderBody();
}
// 연 단위 이동 (260828) — 과거 일정을 볼 때 한 달씩 넘기지 않도록.
// 월 말일에서 연을 옮기면 날짜가 다음 달로 밀릴 수 있어(2/29 등), 1일로 내렸다가 되돌린다.
function chY(n){
  const d=curDate.getDate();
  curDate.setDate(1);
  curDate.setFullYear(curDate.getFullYear()+n);
  const last=new Date(curDate.getFullYear(),curDate.getMonth()+1,0).getDate();
  curDate.setDate(Math.min(d,last));
  updLabel();renderMini();renderBody();
}
function goT(){curDate=new Date(TODAY);updLabel();renderMini();renderBody();}
function setV(v,el){calView=v;document.querySelectorAll('.vb').forEach(b=>b.classList.remove('on'));el.classList.add('on');updLabel();renderBody();}
function updLabel(){
  const ms=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const el=document.getElementById('calLabel');if(!el)return;
  el.textContent=calView==='day'?`${curDate.getFullYear()}.${pad(curDate.getMonth()+1)}.${pad(curDate.getDate())}`:`${curDate.getFullYear()}년 ${ms[curDate.getMonth()]}`;
}
function renderMini(){
  const y=curDate.getFullYear(),m=curDate.getMonth();
  const ms=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const hd=document.getElementById('miniHd');if(!hd)return;
  hd.textContent=`${ms[m]} ${y}`;
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  const evD=new Set(getVis().map(e=>e.date));
  let h='';['일','월','화','수','목','금','토'].forEach(d=>h+=`<div class="md hd">${d}</div>`);
  for(let i=0;i<first;i++)h+=`<div class="md"></div>`;
  for(let d=1;d<=days;d++){const ds=fd(new Date(y,m,d));let cls='md';if(ds===TSTR)cls+=' td';else if(evD.has(ds))cls+=' he';h+=`<div class="${cls}">${d}</div>`;}
  document.getElementById('miniG').innerHTML=h;
}
function getVis(){
  return maydlyEvents.filter(e=>filters[e.label]!==false);
}
function renderBody(){calView==='month'?renderMonth():renderTimeGrid();}

function renderMonth(){
  const y=curDate.getFullYear(),m=curDate.getMonth();
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate();
  let h=`<div class="mg-wrap"><div class="mg-hdr">`;
  ['일','월','화','수','목','금','토'].forEach(d=>h+=`<div class="dl">${d}</div>`);
  h+=`</div><div class="mg">`;
  for(let i=0;i<first;i++)h+=mCell(fd(new Date(y,m-1,prev-first+1+i)),prev-first+1+i,true);
  for(let d=1;d<=days;d++)h+=mCell(fd(new Date(y,m,d)),d,false);
  const rem=(7-(first+days)%7)%7;
  for(let d=1;d<=rem;d++)h+=mCell(fd(new Date(y,m+1,d)),d,true);
  h+=`</div></div>`;
  document.getElementById('calBody').innerHTML=h;
}
function mCell(ds,dn,dim){
  const isT=ds===TSTR;
  let inner='';
  const allVis=getVis();
  const evs=allVis.filter(e=>{
    if(e.date===ds)return true;
    if(e.dur>=24){
      const days=Math.ceil(e.dur/24);
      const start=new Date(e.date);
      for(let i=1;i<days;i++){
        const nd=new Date(start);nd.setDate(start.getDate()+i);
        if(fd(nd)===ds)return true;
      }
    } else if(e.time){
      const _t=e.time.split(':').map(Number);
      if(_t[0]+(_t[1]||0)/60+(e.dur||0)>24){
        const nd=new Date(e.date);nd.setDate(nd.getDate()+1);
        if(fd(nd)===ds)return true;
      }
    }
    return false;
  }).sort(noshLast);   // 노쇼는 시간순 뒤, 맨 아래로
  const dow=new Date(ds+'T00:00').getDay();     // 0=일요일(주 시작)
  let spanHtml='', paHtml='';                    // 장기=맨 위 / PA(기록용)=맨 아래
  evs.forEach(e=>{
    const L=LABELS[e.label]||{name:'기타',color:'#999'};
    // PA(스튜디오)는 기록용 — 항상 칸 맨 아래에 흐리고 작게 (자정 넘는 것도 위로 안 올림)
    if(e.label==='pa_shoot'){
      paHtml+=`<div class="m-bar" style="background:#f0eff4;color:#9a92ad;font-size:8.5px;font-weight:500;line-height:1.35" onclick="event.stopPropagation();openD(${e.id})">${nameTag(e,L.name)}</div>`;
      return;
    }
    const isNosh=e.status==='nosh';
    const isCancel=e.status==='cancel';
    const isSpanCont=e.date!==ds;                // 이 칸이 연속 중간(시작일 아님)
    const _st=e.time?e.time.split(':').map(Number):[0,0];
    const _crossMid=e.time&&(_st[0]+(_st[1]||0)/60+(e.dur||0)>24)&&e.dur<24;
    const multi=e.dur>=24||_crossMid;                        // 다일(장기) 일정
    let op='';
    if(isNosh)op='text-decoration:line-through;';               // 노쇼 = 회색(아래) + 취소선
    else if(isCancel)op='opacity:.35;text-decoration:line-through;';
    else if(!stActive(e.status))op='opacity:.6;';
    if(multi){
      // 이름은 시작일 또는 주 시작(일요일)에만 → 나머지는 색 바만 이어짐
      const showName=!isSpanCont||dow===0;
      spanHtml+=`<div class="m-bar m-span${isSpanCont?' m-cont':''}" style="background:${isNosh?NOSH_COLOR:L.color};color:${isNosh?NOSH_TEXT:lblTc(e.label)};${op}" onclick="event.stopPropagation();openD(${e.id})">${showName?nameTag(e,L.name):'&nbsp;'}</div>`;
    }else{
      const mAlpha=e.allDay?'ff':'80';            // 종일=100%, 비종일=50%
      const mTxc=e.allDay?lblTc(e.label):'var(--tx)';
      inner+=`<div class="m-bar" style="background:${isNosh?NOSH_COLOR:L.color+mAlpha};color:${isNosh?NOSH_TEXT:mTxc};${op}" onclick="event.stopPropagation();openD(${e.id})">${nameTag(e,L.name)}</div>`;
    }
  });
  return`<div class="mc${dim?' dim':''}${isT?' tdc':''}" onclick="openDay('${ds}')"><div class="dn sticky">${dn}</div>${spanHtml}${inner}${paHtml}</div>`;
}

function renderTimeGrid(){
  const isDay=calView==='day',cols=isDay?1:7;
  const days=['일','월','화','수','목','금','토'];
  let ws=new Date(curDate);
  if(!isDay)ws.setDate(curDate.getDate()-curDate.getDay());
  let h=`<div class="tg-wrap"><div class="tg-inner"><div class="tg-grid" style="grid-template-columns:44px repeat(${cols},1fr)">
    <div class="tg-corner" style="height:38px"></div>
    ${Array.from({length:cols},(_,i)=>{const d=new Date(ws);d.setDate(ws.getDate()+i);const isT=fd(d)===TSTR;return`<div class="tg-dh${isT?' td':''}">
      ${!isDay?`<div class="wd">${days[d.getDay()]}</div>`:''}
      <div class="wn">${d.getDate()}</div></div>`;}).join('')}
    ${Array.from({length:HE-HS},(_,r)=>{const hr=HS+r;return`<div class="tg-tl" style="height:${PX}px">${hr}:00</div>`+Array.from({length:cols},(_,i)=>{const d=new Date(ws);d.setDate(ws.getDate()+i);return`<div class="tg-cell" style="height:${PX}px" onclick="openDay('${fd(d)}')"></div>`;}).join('');}).join('')}
  </div></div></div>`;
  document.getElementById('calBody').innerHTML=h;
  requestAnimationFrame(()=>placeBlocks(ws,cols));
}
function placeBlocks(ws,cols){
  const wrap=document.querySelector('.tg-inner');if(!wrap)return;
  const grid=wrap.querySelector('.tg-grid');
  const timeW=44,headerH=38;
  const colW=(grid.getBoundingClientRect().width-timeW)/cols;
  const vis=getVis();
  for(let i=0;i<cols;i++){
    const d=new Date(ws);d.setDate(ws.getDate()+i);
    const ds=fd(d);
    vis.filter(e=>e.date===ds&&e.time).forEach(e=>{
      const[hh,mm]=e.time.split(':').map(Number);if(hh<HS||hh>=HE)return;
      const L=LABELS[e.label]||{name:'기타',color:'#999'};
      const top=headerH+(hh-HS)*PX+(mm/60)*PX,height=e.dur*PX-2;
      const op=e.status==='pending'?'opacity:.7;':'';
      const el=document.createElement('div');
      el.className='t-block';
      el.style.cssText=`top:${top}px;left:${timeW+i*colW+2}px;width:${colW-4}px;height:${height}px;background:${L.color}${e.allDay?'ff':'80'};color:${e.allDay?lblTc(e.label):'var(--tx)'};pointer-events:auto;${op}`;
      el.innerHTML=`<div class="tb-lbl">${nameTag(e,L.name)}</div>${height>28?`<div class="tb-time">${e.time} – ${addH(e.time,e.dur)}</div>`:''}`;
      el.onclick=ev=>{ev.stopPropagation();openD(e.id);};
      wrap.appendChild(el);
    });
  }
}

        <div style="font-size:9px;color:var(--mu);margin-top:1px">${e.time?e.time.slice(0,5)+' – '+addH(e.time,e.dur)+' ('+e.dur+'h)':L.name}</div>
      </div>
    </div>`;

function openD(id){
  const e=maydlyEvents.find(x=>x.id===id);if(!e)return;
  const L=LABELS[e.label]||{name:'기타',color:'#999'};
  document.getElementById('pnh').innerHTML=`${e.client||L.name}<button class="px" onclick="closeP()">×</button>`;
  const emj=e.label==='pa_shoot'?'':stEmoji(e.status);
  const stb=stActive(e.status)
    ?`<span class="badge bOK">${emj?emj+' ':''}${stName(e.status)}</span>`
    :`<span class="badge" style="background:${e.status==='nosh'?NOSH_COLOR:'#c86060'};color:${e.status==='nosh'?NOSH_TEXT:'#fff'}">${emj?emj+' ':''}${stName(e.status)}</span>`;
  let b=`<div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center">${stb}<span style="background:${L.color};color:#fff;font-size:9px;font-weight:700;padding:2px 9px;border-radius:20px">${L.name}</span></div>`;
  const durDays=Math.ceil(e.dur/24);
  if(e.allDay){
    b+=`<div class="det-r"><span class="det-l">📅 날짜</span>${e.date}${durDays>1?` ~ ${addDays(e.date,durDays-1)} (${durDays}일)`:''}</div>`;
    b+=`<div class="det-r"><span class="det-l">🕐 시간</span>종일</div>`;
  } else {
    const _sp=e.date.split('-').map(Number), _tp=(e.time||'0:0').split(':').map(Number);
    const _eMs=Date.UTC(_sp[0],_sp[1]-1,_sp[2],_tp[0],_tp[1])+(e.dur||0)*3600000;
    const _ee=new Date(_eMs), _pp=n=>String(n).padStart(2,'0');
    const _eD=`${_ee.getUTCFullYear()}-${_pp(_ee.getUTCMonth()+1)}-${_pp(_ee.getUTCDate())}`;
    const _eT=`${_pp(_ee.getUTCHours())}:${_pp(_ee.getUTCMinutes())}`;
    b+=`<div class="det-r"><span class="det-l">📅 시작</span>${e.date} ${e.time||''}</div>`;
    b+=`<div class="det-r"><span class="det-l">📅 종료</span>${_eD} ${_eT} <span style="color:#999">(${e.dur}시간)</span></div>`;
  }
  if(e.repeat&&e.repeat!=='none')b+=`<div class="det-r"><span class="det-l">🔁 반복</span>${repeatLabel(e.date,e.repeat)}</div>`;
  if(e.client)b+=`<div class="det-r"><span class="det-l">👤 고객</span>${e.client}</div>`;
  if(e.insta||e.phone)b+=`<div class="det-r"><span class="det-l">📷 인스타</span>${e.insta||e.phone}</div>`;
  if(e.note)b+=`<div class="det-r"><span class="det-l">📝 메모</span>${e.note}</div>`;
  if(!NO_PRICE_LABELS.includes(e.label)){
    const amt=evAmount(e);
    b+=`<div class="det-r"><span class="det-l">💰 금액</span>${amt!=null
      ?amt.toLocaleString('ko-KR')+'원'+(e.amount==null?' <span style="color:var(--mu);font-size:10.5px">(기본 단가'+(e.half?' · ½ 반값':'')+')</span>':'')
      :'<span style="color:var(--mu)">미입력 — 수익에 안 잡힘</span>'}</div>`;
  }
  if(e.status==='nosh')b+=`<div class="det-r"><span class="det-l">🚫 노쇼 사유</span>${e.noshReason?esc(e.noshReason):'<span style="color:var(--mu)">기록 없음</span>'} <button onclick="askNosh(${e.id})" style="margin-left:6px;padding:2px 8px;border:1px solid var(--bd);border-radius:7px;background:var(--sf2);color:var(--mu);font-size:10px;cursor:pointer">${e.noshReason?'수정':'남기기'}</button></div>`;
  b+=reLinkRows(e);   // 재예약 연결·반값 표시
  if(!e.priv&&stActive(e.status)){
    const slots=getMaydlySlots(e.date,maydlyEvents.filter(x=>x.date===e.date&&stActive(x.status)&&!isExt(x)));
    const cv=slots.length===1&&slots[0].allDayBlock?'종일 외부 촬영 일정으로 인한 예약 불가':`예약 불가 (${e.time}~${addH(e.time,e.dur)})`;
    b+=`<div class="client-view-box"><div class="cv-label">고객에게 표시</div><div class="cv-val">${cv}</div></div>`;
  }
  if(e.status==='pending')b+=`<div class="act-row"><button class="btn-ok" onclick="confEv(${e.id});closeP()">✓ 확정</button><button class="btn-ng" onclick="rejEv(${e.id});closeP()">✕ 거절</button></div>`;
  if(e.status==='booked')b+=`<div class="act-row"><button class="btn-ok" onclick="setStatus(${e.id},'outfit');closeP()">👗 의상확인 완료</button></div>`;
  // 촬영 후 구매 선택 — 촬영이 끝난 일정. 이미 고른 뒤에도 다시 눌러 바꿀 수 있다.
  if(e.date<=TSTR&&['booked','outfit','buy_select','buy_raw','buy_color'].includes(e.status)){

// ── getMaydlySlots (관리자용 — busyEvs 포함) ──
function gcalAllDay(ds){return gcalEvents.some(e=>e.allDay&&e.date===ds);}
function gcalTimeBusy(ds){
  return gcalEvents.filter(e=>!e.allDay&&e.date===ds).map(e=>{
    const[sh,sm]=e.time.split(':').map(Number);
    const[eh,em]=e.endTime.split(':').map(Number);
    return{s:sh+sm/60,e:eh+em/60};
  });
}
function getMaydlySlots(ds,busyEvs){
  const dow=dowOf(ds);

  if(dow===1||dow===2||dow===5||dow===6){
    return[{avail:false,allDayBlock:true,label:'종일 외부 촬영 일정으로 인한 예약 불가',s:9,e:21}];
  }
  if(gcalAllDay(ds)){
    return[{avail:false,allDayBlock:true,label:'종일 외부 촬영 일정으로 인한 예약 불가',s:9,e:21}];
  }
  const hasRestDay=busyEvs.some(e=>e.label==='rest'&&e.dur>=8);
  if(hasRestDay){
    return[{avail:false,allDayBlock:true,label:'종일 외부 촬영 일정으로 인한 예약 불가',s:9,e:21}];
  }
  const hasFullShoot=busyEvs.some(e=>['outdoor_c','pa_shoot'].includes(e.label)&&e.dur>=8);
  if(hasFullShoot){
    return[{avail:false,allDayBlock:true,label:'종일 외부 촬영 일정으로 인한 예약 불가',s:9,e:21}];
  }

  const isWeekend=(dow===0);
  const timeSlots=isWeekend
    ?[[11,13],[14,16],[17,19],[20,22]]
    :[[14,16],[17,19],[20,22]];

  const busy=busyEvs.filter(e=>e.time).map(e=>{
    const[hh,mm]=e.time.split(':').map(Number);
    return{s:hh+mm/60,e:hh+mm/60+e.dur};
  });
  const gcalBusy=gcalTimeBusy(ds);
  const allBusy=[...busy,...gcalBusy];

  function isOverlap(s,e){return allBusy.some(r=>!(e<=r.s||s>=r.e));}

  return timeSlots.map(([s,e])=>{
    const avail=!isOverlap(s,e);
    return{avail,allDayBlock:false,label:`${pad(s)}:00~${pad(e)}:00 ${avail?'가능':'불가'}`,s,e};
  });
}

// ── 종일 토글 · 시작/종료 일시 · 반복 (260630 v4.1, 타임트리 구조) ──
const WD=['일','월','화','수','목','금','토'];
function dtAdd(ds,ts,hours){
  const base=new Date(ds+'T'+(ts||'00:00'));
  base.setMinutes(base.getMinutes()+Math.round((hours||0)*60));
  return {date:`${base.getFullYear()}-${pad(base.getMonth()+1)}-${pad(base.getDate())}`,time:`${pad(base.getHours())}:${pad(base.getMinutes())}`};
}
function dtDiffHours(sd,st,ed,et){return (new Date(ed+'T'+(et||'00:00'))-new Date(sd+'T'+(st||'00:00')))/3600000;}
function daySpan(sd,ed){return Math.max(1,Math.round((new Date(ed+'T00:00')-new Date(sd+'T00:00'))/86400000)+1);}
function repeatOptions(ds,sel){
  const d=new Date(ds+'T00:00'),wd=WD[d.getDay()],nth=Math.ceil(d.getDate()/7),dom=d.getDate();
  return [['none','반복 안함'],['daily','매일'],['weekly','매주 '+wd+'요일'],['weekday','매주 평일 (월~금)'],
    ['biweekly','격주 '+wd+'요일'],['4weekly','4주마다 '+wd+'요일'],
    ['monthly_nth','매월 '+nth+'째주 '+wd+'요일'],['monthly_date','매월 '+dom+'일'],['yearly','매년']]
    .map(([v,t])=>`<option value="${v}"${v===sel?' selected':''}>${t}</option>`).join('');
}
function repeatLabel(ds,rep){
  if(!rep||rep==='none')return '';
  const fixed={daily:'매일',weekday:'매주 평일(월~금)',yearly:'매년'};if(fixed[rep])return fixed[rep];
  const d=new Date(ds+'T00:00'),wd=WD[d.getDay()];
  if(rep==='weekly')return '매주 '+wd+'요일';
  if(rep==='biweekly')return '격주 '+wd+'요일';
  if(rep==='4weekly')return '4주마다 '+wd+'요일';
  if(rep==='monthly_nth')return '매월 '+Math.ceil(d.getDate()/7)+'째주 '+wd+'요일';
  if(rep==='monthly_date')return '매월 '+d.getDate()+'일';
  return rep;
}
let seAllDay=false;
function applyAllDay(){
  // 종일만 진한 채움색(활성). 켜지면 시간 관련 입력 숨김.
